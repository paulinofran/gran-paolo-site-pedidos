<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de pedidos — Gran Paolo</title>
<style>
:root{--bg:#FAF4EC;--card:#fff;--ink:#2A1D15;--soft:#7A6A5C;--line:#EADFD0;--verde:#02341b;--vermelho:#ee4152;
  --ok:#1f7a45;--okbg:#DFF0E4;--am:#8a5a00;--ambg:#FFF1CC;--rd:#b3261e;--rdbg:#FCE0DD;--azul:#1b5fa8;--azulbg:#DDEBFA;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer}
.oculto{display:none !important}
#login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
#login h1{margin:0 0 4px;font-size:22px;color:var(--verde)}
#login p{margin:0 0 16px;color:var(--soft);font-size:14px}
#login label{display:block;font-size:13px;color:var(--soft);margin:12px 0 4px}
#login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px}
#login button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--vermelho);color:#fff;font-size:16px;font-weight:700}
#erroLogin{color:var(--rd);font-size:14px;margin-top:10px;min-height:18px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--verde);color:#fff}
header h1{margin:0;font-size:18px}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pilula{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700}
.pilula.aberta{background:var(--okbg);color:var(--ok)}
.pilula.fechada{background:var(--rdbg);color:var(--rd)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700}
.btn.claro{background:#fff;color:var(--verde)}
.btn.vermelho{background:var(--vermelho);color:#fff}
.faixa{margin:12px 16px 0;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:600}
.faixa.erro{background:var(--rdbg);color:var(--rd);border:1px solid #f3b6b0}
.faixa.aviso{background:var(--ambg);color:var(--am);border:1px solid #f1d58a}
.faixa button{margin-left:10px}
main{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 16px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.coluna h2{margin:0 0 8px;font-size:15px;color:var(--soft);font-weight:700}
.vazio{padding:18px;border:1.5px dashed var(--line);border-radius:12px;color:var(--soft);font-size:14px;text-align:center}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nome{font-size:18px;font-weight:800}
.tempo{padding:4px 10px;border-radius:8px;font-size:13px;font-weight:800;white-space:nowrap}
.tempo.verde{background:var(--okbg);color:var(--ok)}
.tempo.amarelo{background:var(--ambg);color:var(--am)}
.tempo.vermelho{background:var(--rdbg);color:var(--rd)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;font-size:13px;color:var(--soft)}
.tipo{padding:3px 9px;border-radius:8px;font-weight:800;font-size:12px}
.tipo.t-drive{background:var(--azulbg);color:var(--azul)}
.tipo.t-comer{background:var(--okbg);color:var(--ok)}
.tipo.t-retirada{background:#EBDDF7;color:#5a2d86}
.tipo.t-entrega{background:var(--ambg);color:var(--am)}
.itens{font-size:15px;margin:6px 0;line-height:1.4}
.extra{font-size:13px;color:var(--soft);margin:2px 0}
.imp{font-size:12px;font-weight:700;margin:6px 0}
.imp.ok{color:var(--ok)}.imp.espera{color:var(--am)}.imp.falha{color:var(--rd)}
.acao{width:100%;height:50px;border:0;border-radius:12px;font-size:17px;font-weight:800;margin-top:6px}
.acao.principal{background:var(--vermelho);color:#fff}
.acao.final{background:var(--verde);color:#fff}
.mini{display:flex;gap:12px;margin-top:8px}
.mini button{background:none;border:0;color:var(--soft);font-size:12px;text-decoration:underline;padding:0}
#feitos{margin:0 16px 24px}
#feitos h2{font-size:15px;color:var(--soft)}
.linha{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;background:var(--card)}
.linha button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px}

.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px;}
.modal-pag{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:440px;color:#2A1D15;}
.modal-pag h3{margin:0 0 4px;font-size:20px;}
.modal-pag p{margin:0 0 14px;color:#7A6A5C;font-size:14px;}
.modal-pag .opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.modal-pag .opcao{padding:16px 8px;border:2.5px solid #E5DCCD;border-radius:14px;background:#fff;font-size:18px;font-weight:800;cursor:pointer;color:#2A1D15;}
.modal-pag .opcao.sel{border-color:#02341b;background:#DFF0E4;color:#02341b;}
.modal-pag .bandeiras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.modal-pag .bandeiras .opcao{padding:11px 4px;font-size:15px;}
.modal-pag .rotulo{font-size:13px;font-weight:700;color:#7A6A5C;margin:4px 0 6px;}
.modal-pag .nota-pediu{display:flex;align-items:center;gap:10px;padding:13px;background:#F7F1E8;border-radius:12px;font-weight:700;font-size:16px;margin-bottom:12px;cursor:pointer;}
.modal-pag .nota-pediu input{width:22px;height:22px;}
.modal-pag .rodape{display:flex;gap:10px;margin-top:6px;}
.modal-pag .rodape button{flex:1;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;}
.modal-pag .confirmar{background:#02341b;color:#fff;}
.modal-pag .confirmar:disabled{opacity:.35;cursor:default;}
.modal-pag .cancelar{background:#EFE6DA;color:#2A1D15;}
.pix-alerta{background:#FFF3CD;border:1px solid #E8C766;border-radius:10px;padding:8px 10px;font-weight:700;margin:6px 0;font-size:14px}
.pix-ok{color:#1a7f37;font-size:12px;margin:4px 0;font-weight:600}
</style>
</head>
<body>

<div id="login">
  <h1>Gran Paolo</h1>
  <p>Painel de pedidos. Entre com o usuário do painel.</p>
  <form id="formLogin">
    <label for="email">E-mail</label>
    <input id="email" type="email" value="painel@granpaolopizzaria.com.br" autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <div id="erroLogin"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="oculto">
  <header>
    <h1>Gran Paolo · Pedidos</h1>
    <div class="barra">
      <span id="statusLoja" class="pilula fechada">...</span>
      <button id="btnLoja" class="btn vermelho">Abrir loja</button>
      <button id="btnSom" class="btn claro">Ativar som</button>
      <button id="btnFeitos" class="btn claro">Concluídos hoje</button>
      <a class="btn claro" href="mesas.html" target="mesas" rel="noopener" style="text-decoration:none">PDV / Mesas</a>
      <a class="btn claro" href="gestao.html" target="gestao" rel="noopener" style="text-decoration:none">Gestão</a>
      <button id="btnSair" class="btn claro">Sair</button>
    </div>
  </header>
  <div id="faixas"></div>
  <main>
    <section class="coluna"><h2 id="tNovos">Novos</h2><div id="cNovos"></div></section>
    <section class="coluna"><h2 id="tCozinha">Na cozinha</h2><div id="cCozinha"></div></section>
    <section class="coluna"><h2 id="tProntos">Prontos</h2><div id="cProntos"></div></section>
  </main>
  <section id="feitos" class="oculto"><h2>Concluídos hoje</h2><div id="listaFeitos"></div></section>
</div>

<script>
const SUPABASE_URL = "https://shhdqvhjvtwoviiqtxng.supabase.co";
const SUPABASE_KEY = "sb_publishable_qpfP7hAj0tmvwVEEqkqluA_iKzPYFUJ";
const LOJA = "gran-paolo";
const CHAVE_SESSAO = "gp_painel_sessao";

let sessao = null, loja = null, statusLoja = null;
let ativos = [], feitos = [], vistos = new Set(), primeiraCarga = true;
let fiscal = {ativo:false, etapa:'concluido'};      // nota fiscal: so pede o pagamento quando estiver ligada
let atendimentos = [], atendVistos = new Set(), atendSilenciados = new Set(), primeiraAtend = true;
let INTERVALO_ATEND = 15000;      // de quanto em quanto tempo repete os bips enquanto alguem espera   // clientes pedindo atendente no WhatsApp
let ctxAudio = null, somAtivo = false, falhasSeguidas = 0, mostrarFeitos = false;

const $ = (id) => document.getElementById(id);
const money = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

/* ---------- acesso (login) ---------- */
function salvarSessao(j){
  sessao = {access_token: j.access_token, refresh_token: j.refresh_token, expira: Date.now() + (j.expires_in || 3600) * 1000};
  try{ localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao)); }catch(e){}
}
async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST', headers: {apikey: SUPABASE_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify({email, password: senha})});
  if(!r.ok) return false;
  salvarSessao(await r.json());
  return true;
}
async function renovar(){
  if(!sessao || !sessao.refresh_token) return false;
  try{
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: {apikey: SUPABASE_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: sessao.refresh_token})});
    if(!r.ok) return false;
    salvarSessao(await r.json());
    return true;
  }catch(e){ return null; }   // sem internet agora: não é motivo pra deslogar
}
function sair(){
  sessao = null;
  try{ localStorage.removeItem(CHAVE_SESSAO); }catch(e){}
  $('app').classList.add('oculto'); $('login').classList.remove('oculto');
}
async function api(caminho, opcoes = {}, jaRenovou = false){
  if(sessao && sessao.expira - Date.now() < 120000 && !jaRenovou) await renovar();
  const headers = Object.assign({apikey: SUPABASE_KEY, 'Content-Type': 'application/json',
    Authorization: 'Bearer ' + (sessao ? sessao.access_token : SUPABASE_KEY)}, opcoes.headers || {});
  const r = await fetch(SUPABASE_URL + caminho, Object.assign({}, opcoes, {headers}));
  if(r.status === 401 && sessao && !jaRenovou){
    if(await renovar()) return api(caminho, opcoes, true);
    sair(); throw new Error('sessao expirada');
  }
  if(!r.ok) throw new Error(await r.text() || ('erro ' + r.status));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const rpc = (nome, corpo) => api('/rest/v1/rpc/' + nome, {method: 'POST', body: JSON.stringify(corpo || {})});

/* ---------- som ---------- */
function prepararSom(){
  try{
    if(!ctxAudio){ const C = window.AudioContext || window.webkitAudioContext; if(C) ctxAudio = new C(); }
    if(ctxAudio && ctxAudio.state === 'suspended') ctxAudio.resume();
    somAtivo = !!ctxAudio;
    manterAcordado();
  }catch(e){ somAtivo = false; }
  atualizarBotaoSom();
}
/* tom contínuo e inaudível: o Chrome entende que a aba "toca áudio" e não a adormece nem suspende o som */
let osciladorVigia = null;
function manterAcordado(){
  try{
    if(!ctxAudio || osciladorVigia) return;
    const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
    o.type = 'sine'; o.frequency.value = 30; g.gain.value = 0.003;
    o.connect(g); g.connect(ctxAudio.destination); o.start();
    osciladorVigia = o;
  }catch(e){}
}
/* se o som cair com algo esperando, a aba pisca avisando (o bip não pode tocar sem um clique) */
let piscaSemSom = false;
function avisarSemSom(){
  try{
    const espera = (typeof ativos !== 'undefined' && ativos.some(p => p.status === 'novo')) ||
                   (typeof atendimentos !== 'undefined' && atendimentos.some(c => !atendSilenciados.has(c.id)));
    if(!somFunciona() && espera){
      piscaSemSom = !piscaSemSom;
      document.title = piscaSemSom ? '🔇 SEM SOM - CLIQUE NA TELA' : 'Painel de pedidos — Gran Paolo';
    }else if(piscaSemSom){ piscaSemSom = false; document.title = 'Painel de pedidos — Gran Paolo'; }
  }catch(e){}
}
setInterval(avisarSemSom, 1000);
function tom(freq, inicio, dur, vol, tipo){
  const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
  o.type = tipo || 'sine'; o.frequency.value = freq; o.connect(g); g.connect(ctxAudio.destination);
  const t0 = ctxAudio.currentTime + inicio;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function tocarPedido(){            // SIRENE de pedido novo: duas notas alternadas, forte e longa (~3,5 s)
  if(!somAtivo || !ctxAudio) return;
  try{ for(let i = 0; i < 10; i++) tom(i % 2 ? 1397 : 988, i * 0.34, 0.3, 1.0, 'square'); }catch(e){}
  piscarPedido();
}
let piscaTimer = null;
function piscarPedido(){           // aba pisca "PEDIDO NOVO" enquanto houver pedido sem Recebi
  if(piscaTimer) return;
  const base = document.title; let lig = false;
  piscaTimer = setInterval(() => {
    const ha = typeof ativos !== 'undefined' && ativos.some(p => p.status === 'novo');
    if(!ha){ clearInterval(piscaTimer); piscaTimer = null; document.title = base; return; }
    lig = !lig; document.title = lig ? '🔔 PEDIDO NOVO!' : base;
  }, 700);
}
function tocarAlerta(){            // aviso grave, diferente da campainha
  if(!somAtivo || !ctxAudio) return;
  try{ tom(300, 0, 0.35, 0.6); tom(300, 0.45, 0.35, 0.6); tom(300, 0.9, 0.35, 0.6); }catch(e){}
}
function tocarAtendimento(){       // bips agudos e rapidos: cliente esperando no WhatsApp
  if(!somAtivo || !ctxAudio) return;
  try{ for(let i = 0; i < 5; i++) tom(1500, i * 0.22, 0.12, 0.55); }catch(e){}
}
function somFunciona(){            // o som só vale se o navegador deixou o áudio rodando
  return !!(somAtivo && ctxAudio && ctxAudio.state === 'running');
}
function atualizarBotaoSom(){
  const ok = somFunciona();
  $('btnSom').textContent = ok ? 'Som ligado' : 'Ativar som';
  $('btnSom').className = 'btn ' + (ok ? 'claro' : 'vermelho');
}
/* o Chrome pode suspender o áudio sozinho (aba parada, PC dormindo): tenta religar e mostra a verdade no botão */
setInterval(() => {
  try{ if(somAtivo && ctxAudio && ctxAudio.state !== 'running') ctxAudio.resume().catch(() => {}); }catch(e){}
  try{ if(somAtivo && ctxAudio && ctxAudio.state === 'running') manterAcordado(); }catch(e){}
  atualizarBotaoSom();
}, 3000);
document.addEventListener('visibilitychange', () => {
  try{ if(ctxAudio && ctxAudio.state !== 'running') ctxAudio.resume().catch(() => {}); }catch(e){}
  atualizarBotaoSom();
});

/* ---------- regras de tempo ---------- */
function prazoDe(p){ const pr = (loja && loja.prazos && loja.prazos[p.modalidade]) || [15, 29]; return pr; }
function minutosDesde(iso){ return (Date.now() - new Date(iso).getTime()) / 60000; }
function infoTempo(p){
  const m = minutosDesde(p.criado_em), [a, b] = prazoDe(p);
  const cor = m < a ? 'verde' : (m <= b ? 'amarelo' : 'vermelho');
  const texto = m <= b ? ('faltam ' + Math.max(1, Math.ceil(b - m)) + ' min') : ('atrasado ' + Math.floor(m - b) + ' min');
  return {cor, texto, m};
}
function ordemPrioridade(p){
  const lista = (loja && loja.prioridade) || ['Drive-thru', 'Vem comer', 'Retirada', 'Entrega'];
  const i = lista.indexOf(p.modalidade); return i < 0 ? 99 : i;
}
function ordenar(a, b){
  return ordemPrioridade(a) - ordemPrioridade(b) || new Date(a.criado_em) - new Date(b.criado_em);
}
function semImpressao(p){
  return (!p.impresso_cozinha_em || !p.impresso_caixa_em) && minutosDesde(p.criado_em) > 2;
}

/* ---------- ações ---------- */
async function mudar(p, status){
  try{ await rpc('painel_mudar_status', {p_pedido: p.id, p_status: status}); await carregar(); }
  catch(e){ avisoErro('Não consegui atualizar o pedido #' + p.numero + '. Tente de novo.'); }
}
const FORMAS_PAG = ['Pix', 'Dinheiro', 'Débito', 'Crédito'];
const BANDEIRAS = [['01', 'Visa'], ['02', 'Master'], ['06', 'Elo'], ['07', 'Hiper'], ['03', 'Amex'], ['99', 'Outras']];
function formaDeclarada(p){
  const t = String(p.pagamento || '');
  if(/débito/i.test(t)) return 'Débito';
  if(/crédito/i.test(t)) return 'Crédito';
  if(/pix/i.test(t)) return 'Pix';
  if(/dinheiro/i.test(t)) return 'Dinheiro';
  return null;
}
// Pergunta como o cliente pagou (a nota fiscal precisa). Devolve true se confirmou e gravou.
function pedirPagamento(p){
  return new Promise(resolve => {
    let forma = p.pagamento_final || formaDeclarada(p), bandeira = p.bandeira || null;
    const fundo = el('div', 'modal-fundo'); fundo.id = 'modalPag';
    const m = el('div', 'modal-pag'); fundo.appendChild(m);
    m.appendChild(el('h3', '', 'Como o cliente pagou?'));
    m.appendChild(el('p', '', 'Pedido #' + p.numero + ' · ' + (p.nome || '') + ' · R$ ' + Number(p.total).toFixed(2).replace('.', ',')));
    const op = el('div', 'opcoes'); m.appendChild(op);
    const rotBand = el('div', 'rotulo', 'Bandeira do cartão'); const band = el('div', 'bandeiras');
    const lbNota = el('label', 'nota-pediu'); const chk = document.createElement('input'); chk.type = 'checkbox'; chk.id = 'chkPediuNota'; chk.checked = !!(p.cpf_nota || p.nota_solicitada);
    lbNota.appendChild(chk); lbNota.appendChild(document.createTextNode('O cliente pediu nota fiscal'));
    const conf = el('button', 'confirmar', 'Confirmar'); conf.id = 'btnConfirmarPag';
    const atualizar = () => {
      [...op.children].forEach(b => b.classList.toggle('sel', b.dataset.forma === forma));
      const cartao = forma === 'Débito' || forma === 'Crédito';
      rotBand.style.display = band.style.display = cartao ? '' : 'none';
      [...band.children].forEach(b => b.classList.toggle('sel', b.dataset.band === bandeira));
      lbNota.style.display = forma === 'Dinheiro' ? '' : 'none';      // pix e cartao sempre saem; dinheiro so se o cliente pedir
      conf.disabled = !forma || (cartao && !bandeira);
    };
    FORMAS_PAG.forEach(f => { const b = el('button', 'opcao', f); b.dataset.forma = f; b.onclick = () => { forma = f; if(f !== 'Débito' && f !== 'Crédito') bandeira = null; atualizar(); }; op.appendChild(b); });
    m.appendChild(rotBand); m.appendChild(band); m.appendChild(lbNota);
    BANDEIRAS.forEach(([cod, nome]) => { const b = el('button', 'opcao', nome); b.dataset.band = cod; b.onclick = () => { bandeira = cod; atualizar(); }; band.appendChild(b); });
    const rod = el('div', 'rodape'); const volta = el('button', 'cancelar', 'Voltar'); volta.id = 'btnVoltarPag';
    volta.onclick = () => { fundo.remove(); resolve(false); };
    conf.onclick = async () => {
      conf.disabled = true;
      try{ await rpc('painel_definir_pagamento', {p_pedido: p.id, p_forma: forma, p_bandeira: bandeira, p_nota: forma === 'Dinheiro' ? chk.checked : null}); fundo.remove(); resolve(true); }
      catch(e){ avisoErro('Não consegui gravar o pagamento do #' + p.numero + '. Tente de novo.'); atualizar(); }
    };
    rod.appendChild(volta); rod.appendChild(conf); m.appendChild(rod);
    document.body.appendChild(fundo); atualizar();
  });
}
// Editar pedido: acrescentar itens e/ou trocar a forma de pagamento
const ROTULO_PAG = {'Pix': 'Pix', 'Dinheiro': 'Dinheiro', 'Débito': 'Cartão de débito (maquininha)', 'Crédito': 'Cartão de crédito (maquininha)'};
let cardapioEdicao = null;
async function categoriasDoCardapio(){
  if(!cardapioEdicao){ cardapioEdicao = await rpc('cardapio_publico', {p_loja: LOJA}); }
  return ((cardapioEdicao && cardapioEdicao.categorias) || [])
    .map(c => ({nome: c.nome, produtos: (c.produtos || []).filter(x => x.disponivel && !x.esgotado && (x.tamanhos || []).length)}))
    .filter(c => c.produtos.length);
}
function reais(v){ return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }
function editarPedido(p){
  if(p.conta_id){
    avisoErro('O pedido #' + p.numero + ' foi lançado no PDV. Para trocar o pagamento ou acrescentar item, use a Conta no PDV.');
    return;
  }
  if(p.pagamento === 'Pix online (QR Code)' || p.mp_status){
    avisoErro('O pedido #' + p.numero + ' foi pago pelo Pix do site. Para acrescentar algo, lance como novo pedido no PDV; para trocar a forma, devolva o Pix primeiro.');
    return;
  }
  const atual = formaDeclarada(p);
  let forma = atual, bandeira = p.bandeira || null;
  const novos = [];
  const tirar = new Set();     // posicoes (0, 1, 2...) dos itens do pedido que a atendente marcou para tirar
  const fundo = el('div', 'modal-fundo'); fundo.id = 'modalEditar';
  const m = el('div', 'modal-pag'); fundo.appendChild(m);
  m.style.maxHeight = '92vh'; m.style.overflowY = 'auto';
  m.appendChild(el('h3', '', 'Editar pedido #' + p.numero));
  const sub = el('p', '', ''); m.appendChild(sub);

  /* ---- endereco de entrega ---- */
  const ehEntrega = p.modalidade === 'Entrega';
  let taxaAtual = Number(p.taxa_entrega) || 0, taxaNova = taxaAtual, bairroNovo = p.bairro || '';
  const inEnd = document.createElement('input'); inEnd.type = 'text'; inEnd.value = p.endereco || '';
  inEnd.style.cssText = 'width:100%;padding:11px;border:1.5px solid #E5DCCD;border-radius:10px;font-size:16px;margin-bottom:8px;background:#fff;color:#2A1D15;';
  const selBairro = document.createElement('select');
  selBairro.style.cssText = inEnd.style.cssText;
  const avisoEnd = el('div', ''); avisoEnd.style.cssText = 'font-size:13px;color:#8a5a00;margin:-2px 0 6px;display:none;';
  const endMudou = () => ehEntrega && inEnd.value.trim().length >= 5 && (inEnd.value.trim() !== String(p.endereco || '').trim() || bairroNovo !== (p.bairro || ''));
  if(ehEntrega){
    m.appendChild(el('div', 'rotulo', 'Endereço de entrega'));
    const caixaEnd = el('div', ''); caixaEnd.style.cssText = 'background:#F7F1E8;border-radius:12px;padding:10px;margin-bottom:12px;';
    caixaEnd.appendChild(inEnd); caixaEnd.appendChild(selBairro); caixaEnd.appendChild(avisoEnd);
    m.appendChild(caixaEnd);
    inEnd.oninput = () => atualizar();
    selBairro.onchange = () => {
      bairroNovo = selBairro.value;
      const b = (selBairro.bairros || []).find(x => x.nome === bairroNovo);
      taxaNova = (bairroNovo === (p.bairro || '') || !b) ? taxaAtual : Number(b.taxa);
      atualizar();
    };
  }

  /* ---- tirar item ---- */
  const itensPed = Array.isArray(p.itens) ? p.itens : [];
  const rotItem = i => { const nm = String(i.nome || ''); return (i.qtd || 1) + 'x ' + (nm.indexOf('Meio a Meio: ') === 0 ? 'Meio a Meio (' + nm.slice(13).replace(/Pizza /g, '') + ')' : nm) + (i.tamanho && i.tamanho !== 'Única' ? ' (' + i.tamanho + ')' : ''); };
  const valItem = i => (Number(i.qtd) || 1) * (Number(i.precoUnit) || 0);
  const tirarSoma = () => [...tirar].reduce((s, k) => s + valItem(itensPed[k] || {}), 0);
  const caixaTirar = el('div', ''); caixaTirar.style.cssText = 'background:#F7F1E8;border-radius:12px;padding:10px;margin-bottom:12px;font-size:15px;';
  const avisoTirar = el('div', ''); avisoTirar.style.cssText = 'font-size:13px;color:#8a5a00;margin-top:6px;display:none;';
  if(itensPed.length > 1){
    m.appendChild(el('div', 'rotulo', 'Tirar item do pedido'));
    m.appendChild(caixaTirar);
  } else {
    const dica = el('div', ''); dica.style.cssText = 'font-size:13px;color:#7a6a5a;margin-bottom:10px;';
    dica.textContent = 'Este pedido tem só 1 item. Para tirar tudo, feche e use “Cancelar pedido”.';
    m.appendChild(dica);
  }

  /* ---- acrescentar item ---- */
  m.appendChild(el('div', 'rotulo', 'Acrescentar item'));
  const caixaItem = el('div', ''); caixaItem.style.cssText = 'background:#F7F1E8;border-radius:12px;padding:10px;margin-bottom:12px;';
  const mk = (tag) => { const x = document.createElement(tag); x.style.cssText = 'width:100%;padding:11px;border:1.5px solid #E5DCCD;border-radius:10px;font-size:16px;margin-bottom:8px;background:#fff;color:#2A1D15;'; return x; };
  const selCat = mk('select'), selProd = mk('select'), selTam = mk('select');
  const linhaQtd = el('div', ''); linhaQtd.style.cssText = 'display:flex;gap:8px;align-items:center;';
  const inQtd = mk('input'); inQtd.type = 'number'; inQtd.min = '1'; inQtd.max = '20'; inQtd.value = '1'; inQtd.style.width = '90px'; inQtd.style.marginBottom = '0';
  const btnAdd = el('button', 'opcao', 'Adicionar'); btnAdd.style.cssText = 'flex:1;padding:11px;font-size:16px;';
  linhaQtd.appendChild(inQtd); linhaQtd.appendChild(btnAdd);
  caixaItem.appendChild(selCat); caixaItem.appendChild(selProd); caixaItem.appendChild(selTam); caixaItem.appendChild(linhaQtd);
  const lista = el('div', ''); lista.style.cssText = 'margin-top:8px;font-size:15px;';
  caixaItem.appendChild(lista);
  m.appendChild(caixaItem);
  const lbCoz = el('label', 'nota-pediu'); const chkCoz = document.createElement('input'); chkCoz.type = 'checkbox';
  lbCoz.appendChild(chkCoz); lbCoz.appendChild(document.createTextNode('Reimprimir na cozinha também (só se mudou comida; sai o pedido todo)'));
  m.appendChild(lbCoz);

  /* ---- forma de pagamento ---- */
  m.appendChild(el('div', 'rotulo', 'Forma de pagamento'));
  const op = el('div', 'opcoes'); m.appendChild(op);
  const rotBand = el('div', 'rotulo', 'Bandeira do cartão'); const band = el('div', 'bandeiras');
  const lbNota = el('label', 'nota-pediu'); const chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = !!(p.cpf_nota || p.nota_solicitada);
  lbNota.appendChild(chk); lbNota.appendChild(document.createTextNode('O cliente pediu nota fiscal'));
  const erroEd = el('div', 'rotulo', ''); erroEd.style.cssText = 'color:#b3261e;font-weight:700;font-size:14px;margin:6px 0;display:none;';
  const caixaTroco = el('div', ''); caixaTroco.style.cssText = 'margin-bottom:12px;';
  caixaTroco.appendChild(el('div', 'rotulo', 'Troco para quanto? (deixe vazio se não precisa)'));
  const inTroco = document.createElement('input'); inTroco.type = 'text'; inTroco.inputMode = 'decimal'; inTroco.placeholder = 'Ex.: 50';
  inTroco.style.cssText = 'width:100%;padding:12px;border:1.5px solid #E5DCCD;border-radius:10px;font-size:18px;background:#fff;color:#2A1D15;';
  { const mt = /troco para R\$\s*([\d.,]+)/i.exec(String(p.pagamento || '')); if(mt) inTroco.value = mt[1]; }
  inTroco.oninput = () => atualizar();
  caixaTroco.appendChild(inTroco);
  const trocoNum = () => { let t = String(inTroco.value || '').trim().replace(/[^\d.,]/g, ''); if(!t) return null; if(t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return isFinite(n) && n > 0 ? n : NaN; };
  const rotuloPag = () => {
    if(forma === 'Dinheiro'){ const t = trocoNum(); return (t && !isNaN(t)) ? 'Dinheiro (troco para R$ ' + t.toFixed(2).replace('.', ',') + ')' : 'Dinheiro'; }
    return ROTULO_PAG[forma];
  };
  const conf = el('button', 'confirmar', 'Salvar'); conf.id = 'btnSalvarEdicao';
  const totalNovo = () => Math.max(0, Number(p.total) - tirarSoma() + (taxaNova - taxaAtual) + novos.reduce((s, i) => s + i.precoUnit * i.qtd, 0));
  const pagMudou = () => !!forma && (forma !== atual || rotuloPag() !== p.pagamento || ((forma === 'Débito' || forma === 'Crédito') && (bandeira || null) !== (p.bandeira || null)));
  const atualizar = () => {
    sub.textContent = (p.nome || '') + ' · ' + reais(totalNovo()) + (Math.abs(totalNovo() - Number(p.total)) > 0.004 ? ' (era ' + reais(p.total) + ')' : '') + ' · cobrar: ' + (p.pagamento || '—');
    if(ehEntrega){
      avisoEnd.textContent = taxaNova !== taxaAtual ? 'Taxa de entrega: ' + reais(taxaAtual) + ' → ' + reais(taxaNova) + '. O total muda junto.' : '';
      avisoEnd.style.display = avisoEnd.textContent ? '' : 'none';
    }
    caixaTirar.textContent = '';
    itensPed.forEach((i, k) => {
      const marcado = tirar.has(k);
      const l = el('div', '', rotItem(i) + ' · ' + reais(valItem(i)) + '  ');
      l.style.cssText = 'padding:5px 0;' + (marcado ? 'text-decoration:line-through;color:#b3261e;' : '');
      const x = el('button', '', marcado ? 'desfazer' : 'tirar'); x.style.cssText = 'background:none;border:0;color:#b3261e;text-decoration:underline;font-size:14px;cursor:pointer;padding:4px 6px;';
      if(!marcado && tirar.size >= itensPed.length - 1){ x.disabled = true; x.style.opacity = '.4'; x.title = 'Para tirar tudo, use Cancelar pedido'; }
      x.onclick = () => { if(marcado) tirar.delete(k); else tirar.add(k); atualizar(); };
      caixaTirar.appendChild(l); l.appendChild(x);
    });
    avisoTirar.textContent = [...tirar].some(k => { const i = itensPed[k] || {}; return i.promo || /—/.test(String(i.tamanho || '')); })
      ? 'Atenção: este item é de uma promoção. Confira com o cliente se o valor novo está certo.' : '';
    avisoTirar.style.display = avisoTirar.textContent ? '' : 'none';
    caixaTirar.appendChild(avisoTirar);
    lista.textContent = '';
    novos.forEach((i, k) => {
      const l = el('div', '', '+ ' + i.qtd + 'x ' + i.nome + (i.tamanho && i.tamanho !== 'Única' ? ' (' + i.tamanho + ')' : '') + ' · ' + reais(i.precoUnit * i.qtd) + '  ');
      l.style.cssText = 'padding:4px 0;';
      const x = el('button', '', 'tirar'); x.style.cssText = 'background:none;border:0;color:#b3261e;text-decoration:underline;font-size:13px;cursor:pointer;';
      x.onclick = () => { novos.splice(k, 1); atualizar(); };
      l.appendChild(x); lista.appendChild(l);
    });
    lbCoz.style.display = (novos.length || tirar.size) ? '' : 'none';
    [...op.children].forEach(b => b.classList.toggle('sel', b.dataset.forma === forma));
    const cartao = forma === 'Débito' || forma === 'Crédito';
    rotBand.style.display = band.style.display = cartao ? '' : 'none';
    [...band.children].forEach(b => b.classList.toggle('sel', b.dataset.band === bandeira));
    lbNota.style.display = forma === 'Dinheiro' ? '' : 'none';
    caixaTroco.style.display = forma === 'Dinheiro' ? '' : 'none';
    const t = forma === 'Dinheiro' ? trocoNum() : null;
    const trocoRuim = forma === 'Dinheiro' && t !== null && (isNaN(t) || t < totalNovo());
    if(trocoRuim){ erroEd.textContent = isNaN(t) ? 'Troco inválido. Digite só o valor da nota, por exemplo 50.' : 'O troco precisa ser maior ou igual ao total (' + reais(totalNovo()) + ').'; erroEd.style.display = ''; }
    else if(erroEd.dataset.troco === '1'){ erroEd.style.display = 'none'; }
    erroEd.dataset.troco = trocoRuim ? '1' : '';
    conf.disabled = !(novos.length || tirar.size || pagMudou() || endMudou()) || (pagMudou() && cartao && !bandeira) || trocoRuim;   // bandeira so e exigida se a forma de pagamento foi mudada
  };
  FORMAS_PAG.forEach(f => { const b = el('button', 'opcao', f); b.dataset.forma = f; b.onclick = () => { forma = f; if(f !== 'Débito' && f !== 'Crédito') bandeira = null; atualizar(); }; op.appendChild(b); });
  m.appendChild(rotBand); m.appendChild(band); m.appendChild(caixaTroco); m.appendChild(lbNota);
  BANDEIRAS.forEach(([cod, nome]) => { const b = el('button', 'opcao', nome); b.dataset.band = cod; b.onclick = () => { bandeira = cod; atualizar(); }; band.appendChild(b); });

  /* menu */
  let cats = [];
  const povoar = (sel, itens, rot) => { sel.textContent = ''; itens.forEach((t, k) => { const o = document.createElement('option'); o.value = k; o.textContent = rot(t); sel.appendChild(o); }); };
  const trocouCat = () => { const c = cats[selCat.value]; povoar(selProd, c ? c.produtos : [], x => x.nome); trocouProd(); };
  const trocouProd = () => { const c = cats[selCat.value], x = c && c.produtos[selProd.value]; povoar(selTam, x ? x.tamanhos : [], t => t.nome + ' · ' + reais(t.preco)); };
  selCat.onchange = trocouCat; selProd.onchange = trocouProd;
  categoriasDoCardapio().then(() => {
    if(!ehEntrega) return;
    const lista = ((cardapioEdicao && cardapioEdicao.bairros) || []).map(b => ({nome: b.nome, taxa: Number(b.taxa)}));
    if(p.bairro && !lista.some(b => b.nome === p.bairro)) lista.unshift({nome: p.bairro, taxa: taxaAtual});
    selBairro.bairros = lista; selBairro.textContent = '';
    lista.forEach(b => { const o = document.createElement('option'); o.value = b.nome; o.textContent = b.nome + ' · ' + reais(b.taxa); selBairro.appendChild(o); });
    selBairro.value = p.bairro || ''; bairroNovo = selBairro.value; atualizar();
  }).catch(() => {});
  categoriasDoCardapio().then(c => { cats = c; povoar(selCat, cats, x => x.nome); trocouCat(); })
    .catch(() => { caixaItem.textContent = 'Não consegui carregar o cardápio. Feche e tente de novo.'; });
  btnAdd.onclick = () => {
    const c = cats[selCat.value], x = c && c.produtos[selProd.value], t = x && x.tamanhos[selTam.value];
    const q = Math.max(1, Math.min(20, parseInt(inQtd.value, 10) || 1));
    if(!x || !t) return;
    novos.push({qtd: q, nome: x.nome, tamanho: t.nome, precoUnit: Number(t.preco), promo: false});
    inQtd.value = '1'; atualizar();
  };

  m.appendChild(erroEd);
  const rod = el('div', 'rodape'); const volta = el('button', 'cancelar', 'Voltar'); volta.onclick = () => fundo.remove();
  conf.onclick = async () => {
    conf.disabled = true; erroEd.style.display = 'none';
    try{
      if(endMudou()){
        await rpc('painel_editar_entrega', {p_pedido: p.id, p_endereco: inEnd.value.trim(), p_bairro: bairroNovo});
        p.total = Number(p.total) - taxaAtual + taxaNova; p.taxa_entrega = taxaNova; p.endereco = inEnd.value.trim(); p.bairro = bairroNovo; taxaAtual = taxaNova;
      }
      if(tirar.size){
        await rpc('painel_remover_itens', {p_pedido: p.id, p_indices: [...tirar].sort((a, b) => a - b), p_cozinha: chkCoz.checked});
        const antes = Number(p.total), sobrou = itensPed.filter((i, k) => !tirar.has(k));
        p.total = Math.max(0, antes - tirarSoma()); p.itens = sobrou;   // ja gravado: atualiza aqui para nao tirar de novo se o pagamento falhar
        itensPed.length = 0; sobrou.forEach(i => itensPed.push(i)); tirar.clear();
      }
      if(novos.length){
        await rpc('painel_acrescentar_itens', {p_pedido: p.id, p_itens: novos.slice(), p_cozinha: chkCoz.checked});
        p.total = totalNovo(); novos.length = 0;     // ja gravado: se o pagamento falhar, nao soma de novo
      }
      if(pagMudou()){
        await rpc('painel_trocar_pagamento', {p_pedido: p.id, p_pagamento: rotuloPag()});
        await rpc('painel_definir_pagamento', {p_pedido: p.id, p_forma: forma, p_bandeira: bandeira, p_nota: forma === 'Dinheiro' ? chk.checked : null});
      }
      fundo.remove(); await carregar();
    }catch(e){
      let t = String((e && e.message) || e || '');
      try{ const j = JSON.parse(t); t = j.message || j.hint || j.details || t; }catch(x){}
      erroEd.textContent = (t && t.length < 220) ? t : 'Não consegui salvar a edição do #' + p.numero + '. Tente de novo.';
      erroEd.style.display = '';
      await carregar().catch(() => {});
      atualizar();
    }
  };
  rod.appendChild(volta); rod.appendChild(conf); m.appendChild(rod);
  document.body.appendChild(fundo); atualizar();
}
async function avancar(p){
  const proximo = p.status === 'novo' ? 'cozinha' : p.status === 'cozinha' ? 'pronto' : 'concluido';
  if(fiscal.ativo && proximo === fiscal.etapa && !p.pagamento_final){ if(!(await pedirPagamento(p))) return; }
  mudar(p, proximo);
}
async function conferirPix(p){
  if(!confirm('O Pix de ' + money(p.total) + (p.nome ? ' (' + p.nome + ')' : '') + ' caiu na conta? Ao confirmar, o pedido #' + p.numero + ' imprime.')) return;
  try{ await rpc('painel_conferir_pix', {p_pedido: p.id}); await carregar(); }
  catch(e){ avisoErro('Não consegui conferir o Pix do #' + p.numero + '. Tente de novo.'); }
}
async function reimprimir(p){
  try{ await rpc('painel_reimprimir', {p_pedido: p.id}); await carregar(); }
  catch(e){ avisoErro('Não consegui pedir a reimpressão do #' + p.numero + '.'); }
}
async function mandarParaMesa(p){
  const r = (prompt('Mandar o pedido #' + p.numero + ' (' + (p.nome || '') + ') para qual mesa?\nDigite o número da mesa (1 a 10) ou Balcao:') || '').trim();
  if(!r) return;
  const mesa = /^balc/i.test(r) ? 'Balcao' : r.replace(/\D/g, '');
  if(!mesa){ avisoErro('Mesa inválida. Digite só o número (1 a 10) ou Balcao.'); return; }
  try{ await rpc('mesa_anexar_pedido', {p_loja: LOJA, p_pedido: p.id, p_mesa: mesa, p_comanda: 'Comanda 1'}); await carregar(); }
  catch(e){ avisoErro('Não consegui mandar para a mesa: ' + ((e && e.message) || 'tente de novo') + '. (A Parte AN precisa estar instalada no Supabase.)'); }
}
function rotuloFinal(p){
  if(p.modalidade === 'Entrega') return 'Saiu para entrega';
  if(p.modalidade === 'Vem comer') return 'Levei na mesa';
  return 'Entreguei';
}
async function alternarLoja(){
  const abrir = !(loja && loja.aberta);
  if(!abrir && ativos.length && !confirm('Ainda há ' + ativos.length + ' pedido(s) na tela. Fechar a loja mesmo assim? Pedidos novos deixam de entrar.')) return;
  try{ statusLoja = await rpc('painel_definir_loja', {p_loja: LOJA, p_aberta: abrir}); await carregar(); }
  catch(e){ avisoErro('Não consegui ' + (abrir ? 'abrir' : 'fechar') + ' a loja. Tente de novo.'); }
}
let timerAviso = null;
function avisoErro(txt){
  const f = el('div', 'faixa erro', txt); $('faixas').appendChild(f);
  clearTimeout(timerAviso); timerAviso = setTimeout(() => { if(f.parentNode) f.parentNode.removeChild(f); }, 6000);
}

/* ---------- desenho ---------- */
function classeTipo(m){ return m === 'Drive-thru' ? 't-drive' : m === 'Vem comer' ? 't-comer' : m === 'Retirada' ? 't-retirada' : 't-entrega'; }
function cartao(p){
  const t = infoTempo(p), c = el('div', 'cartao');
  const topo = el('div', 'topo');
  topo.appendChild(el('div', 'nome', '#' + p.numero + ' ' + (p.nome || '')));
  topo.appendChild(el('span', 'tempo ' + t.cor, t.texto));
  c.appendChild(topo);
  const meta = el('div', 'meta');
  meta.appendChild(el('span', 'tipo ' + classeTipo(p.modalidade), p.modalidade || ''));
  meta.appendChild(el('span', '', money(p.total)));
  meta.appendChild(el('span', '', 'cobrar: ' + (p.pagamento || (p.conta_id ? 'no PDV (ainda não pago)' : '—'))));
  meta.appendChild(el('span', '', 'há ' + Math.floor(t.m) + ' min'));
  c.appendChild(meta);
  const pixPend = p.pix_retido === true;
  if(pixPend) c.appendChild(el('div', 'pix-alerta', '💰 PIX AGORA: confira no app do banco se caiu ' + money(p.total) + (p.nome ? ' de ' + p.nome : '') + '. O pedido só imprime depois.'));
  else if(p.pix_conferido_em) c.appendChild(el('div', 'pix-ok', '✅ Pix conferido'));
  const itens = el('div', 'itens');
  (Array.isArray(p.itens) ? p.itens : []).forEach(i => {
    const nm = String(i.nome || '');
    if (nm.indexOf('Meio a Meio: ') === 0) {   // meio a meio: cada sabor numa linha
      const bl = el('div', '', (i.qtd || 1) + 'x Meio a Meio (' + i.tamanho + ')');
      nm.slice(13).split(' / ').forEach(x => { const d = el('div', '', '½ ' + x.replace(/^Pizza /, '')); d.style.marginLeft = '16px'; bl.appendChild(d); });
      itens.appendChild(bl);
    } else itens.appendChild(el('div', '', (i.qtd || 1) + 'x ' + nm + ' (' + i.tamanho + ')'));
  });
  c.appendChild(itens);
  if(p.modalidade === 'Entrega'){
    c.appendChild(el('div', 'extra', 'Bairro: ' + (p.bairro || '—') + ' · ' + (p.endereco || 'sem endereço')));
  }
  if(p.telefone) c.appendChild(el('div', 'extra', 'WhatsApp: ' + p.telefone));
  if(p.obs) c.appendChild(el('div', 'extra', 'Obs: ' + p.obs));
  if(pixPend) c.appendChild(el('div', 'imp espera', 'Aguardando o Pix: ainda não imprime'));
  else if(p.impresso_cozinha_em && p.impresso_caixa_em) c.appendChild(el('div', 'imp ok', 'Impresso'));
  else if(semImpressao(p)) c.appendChild(el('div', 'imp falha', 'NÃO IMPRIMIU' + (p.impressao_erro ? ' — ' + p.impressao_erro : '')));
  else c.appendChild(el('div', 'imp espera', 'Imprimindo...'));
  const b = el('button', 'acao ' + (p.status === 'pronto' ? 'final' : 'principal'),
    pixPend ? 'Pix caiu: imprimir' : p.status === 'novo' ? 'Recebi' : p.status === 'cozinha' ? 'Pronto' : rotuloFinal(p));
  b.onclick = () => pixPend ? conferirPix(p) : avancar(p);
  c.appendChild(b);
  const mini = el('div', 'mini');
  const voltar = el('button', '', 'Voltar etapa');
  if(p.status === 'novo') voltar.className = 'oculto';
  voltar.onclick = () => mudar(p, p.status === 'cozinha' ? 'novo' : 'cozinha');
  const re = el('button', pixPend ? 'oculto' : '', 'Reimprimir'); re.onclick = () => reimprimir(p);
  const canc = el('button', '', 'Cancelar pedido');
  canc.onclick = async () => {
    if(!confirm('Cancelar o pedido #' + p.numero + '?')) return;
    const motivo = (prompt('Motivo do cancelamento (opcional):') || '').trim();
    await mudar(p, 'cancelado');
    if(motivo){ try{ await rpc('painel_motivo_cancelamento', {p_pedido: p.id, p_motivo: motivo}); }catch(e){} }     // sem a Parte H, so nao anota o motivo
  };
  const edit = el('button', '', 'Editar pedido'); edit.onclick = () => editarPedido(p);
  mini.appendChild(voltar); mini.appendChild(re); mini.appendChild(edit); mini.appendChild(canc);
  c.appendChild(mini);
  if(p.modalidade === 'Vem comer' && !p.conta_id && !pixPend){
    const bm = el('button', 'acao', '🍽 Mandar para a mesa'); bm.style.marginTop = '8px'; bm.onclick = () => mandarParaMesa(p); c.appendChild(bm);
  } else if(p.conta_id && p.mesa){ c.appendChild(el('div', 'extra', '🍽 ' + (p.mesa === 'Balcao' ? 'Balcão' : 'Mesa ' + p.mesa))); }
  return c;
}
function desenhar(){
  const cols = {novo: $('cNovos'), cozinha: $('cCozinha'), pronto: $('cProntos')};
  const titulos = {novo: ['tNovos', 'Novos'], cozinha: ['tCozinha', 'Na cozinha'], pronto: ['tProntos', 'Prontos']};
  Object.keys(cols).forEach(s => {
    const lista = ativos.filter(p => p.status === s).sort(ordenar);
    cols[s].textContent = '';
    $(titulos[s][0]).textContent = titulos[s][1] + ' (' + lista.length + ')';
    if(!lista.length) cols[s].appendChild(el('div', 'vazio', s === 'novo' ? 'Nenhum pedido novo' : 'Nada por aqui'));
    lista.forEach(p => cols[s].appendChild(cartao(p)));
  });
  // status da loja
  const aberta = !!(loja && loja.aberta);
  const pil = $('statusLoja');
  if(statusLoja && statusLoja.motivo === 'fora_horario'){ pil.textContent = 'Fora do horário · abre ' + (statusLoja.proxima || ''); pil.className = 'pilula fechada'; }
  else if(aberta){ pil.textContent = 'Loja aberta'; pil.className = 'pilula aberta'; }
  else { pil.textContent = 'Loja fechada'; pil.className = 'pilula fechada'; }
  $('btnLoja').textContent = aberta ? 'Fechar loja' : 'Abrir loja';
  $('btnLoja').className = 'btn ' + (aberta ? 'claro' : 'vermelho');
  // faixas
  const f = $('faixas'); f.textContent = '';
  if(falhasSeguidas >= 3) f.appendChild(el('div', 'faixa erro', 'Sem conexão com o sistema. Verifique a internet. Os pedidos podem não estar chegando.'));
  if(atendimentos.length){
    const fa = el('div', 'faixa aviso', '💬 ' + atendimentos.length + (atendimentos.length === 1 ? ' cliente pede' : ' clientes pedem') + ' atendimento no WhatsApp: ' + atendimentos.slice(0, 3).map(c => (c.nome || c.telefone)).join(', ') + '. ');
    const la = el('a', '', 'Ver e marcar como atendido'); la.href = 'gestao.html#robo'; la.target = 'gestao'; la.rel = 'noopener'; la.style.color = 'inherit'; la.style.fontWeight = '800'; fa.appendChild(la);
    if(atendimentos.some(c => !atendSilenciados.has(c.id))){
      const bv = el('button', 'btn claro', 'Já vi (parar o som)'); bv.id = 'btnJaVi';
      bv.onclick = () => { atendimentos.forEach(c => atendSilenciados.add(c.id)); desenhar(); }; fa.appendChild(bv);
    }
    const bo = el('button', 'btn claro', 'Atendido'); bo.id = 'btnAtendido';
    bo.onclick = async () => {
      try{ for(const c of atendimentos) await rpc('bot_marcar_atendido', {p_loja: LOJA, p_telefone: c.telefone}); await carregar(); }
      catch(e){ avisoErro('Não consegui marcar como atendido. Tente de novo.'); }
    }; fa.appendChild(bo); f.appendChild(fa);
  }
  if(!somFunciona()) f.appendChild(el('div', 'faixa aviso', 'O som está desligado. Toque em "Ativar som" para ouvir os pedidos novos.'));
  const sem = ativos.filter(semImpressao);
  if(sem.length) f.appendChild(el('div', 'faixa erro', 'ATENÇÃO: ' + sem.length + ' pedido(s) sem imprimir (' + sem.map(p => '#' + p.numero).join(', ') + '). Veja papel, cabo e impressora, ou toque em Reimprimir.'));
  // concluídos
  $('feitos').classList.toggle('oculto', !mostrarFeitos);
  const lf = $('listaFeitos'); lf.textContent = '';
  feitos.forEach(p => {
    const l = el('div', 'linha');
    const hora = p.concluido_em ? new Date(p.concluido_em).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) : '';
    l.appendChild(el('span', '', '#' + p.numero + ' ' + (p.nome || '') + ' · ' + p.modalidade + ' · ' + money(p.total) + ' · ' + p.status + ' ' + hora));
    const d = el('button', '', 'Desfazer'); d.onclick = () => mudar(p, 'pronto'); l.appendChild(d);
    lf.appendChild(l);
  });
}

/* ---------- carregar ---------- */
function inicioDoDia(){ const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString(); }
async function carregar(){
  try{
    const [a, f, l, st, at, fc] = await Promise.all([
      api('/rest/v1/pedidos?select=*&loja_id=eq.' + LOJA + '&status=in.(novo,cozinha,pronto)&order=criado_em.asc'),
      api('/rest/v1/pedidos?select=*&loja_id=eq.' + LOJA + '&status=in.(concluido,cancelado)&criado_em=gte.' + encodeURIComponent(inicioDoDia()) + '&order=criado_em.desc'),
      api('/rest/v1/lojas?select=*&id=eq.' + LOJA),
      api('/rest/v1/rpc/loja_status', {method: 'POST', body: JSON.stringify({p_loja: LOJA})}),
      // isolado de proposito: se o robo ainda nao foi instalado no banco, o painel segue normal
      api('/rest/v1/bot_conversas?select=id,nome,telefone,motivo&loja_id=eq.' + LOJA + '&precisa_humano=eq.true&order=ultima_entrada_em.desc').catch(() => []),
      api('/rest/v1/fiscal_config?select=ativo,emitir_em&loja_id=eq.' + LOJA).catch(() => []),     // idem: sem a Parte G, nada muda
    ]);
    ativos = a || []; feitos = f || []; loja = (l && l[0]) || loja; statusLoja = st; falhasSeguidas = 0;
    // toca na 1a vez que o pedido aparece: 'novo' OU ja em 'cozinha' (o agente aceita sozinho em ~4 s e a tela pode nao pegar o 'novo' a tempo)
    const novosAgora = ativos.filter(p => !vistos.has(p.id) && (p.status === 'novo' || (p.status === 'cozinha' && !p.conta_id && !p.pix_retido)));
    ativos.forEach(p => vistos.add(p.id));
    if(novosAgora.length && !primeiraCarga) tocarPedido();
    primeiraCarga = false;
    fiscal = (fc && fc[0]) ? {ativo: fc[0].ativo === true, etapa: fc[0].emitir_em || 'concluido'} : {ativo:false, etapa:'concluido'};
    atendimentos = at || [];
    // quem saiu da fila (Atendido) é esquecido: se o mesmo cliente chamar de novo, vale como aviso NOVO (bipa na hora)
    { const ids = new Set(atendimentos.map(c => c.id));
      [...atendVistos].forEach(id => { if(!ids.has(id)) atendVistos.delete(id); });
      [...atendSilenciados].forEach(id => { if(!ids.has(id)) atendSilenciados.delete(id); }); }
    const novosAtend = atendimentos.filter(c => !atendVistos.has(c.id));
    atendimentos.forEach(c => atendVistos.add(c.id));
    if(novosAtend.length) tocarAtendimento();      // ja toca na hora (tambem na primeira carga)
    primeiraAtend = false;
  }catch(e){ falhasSeguidas++; }
  desenhar();
}

/* ---------- ciclo de vida ---------- */
function iniciarPainel(){
  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  atualizarBotaoSom();
  carregar();
}
let timers = [];
function ligarTimers(){
  timers.forEach(clearInterval); timers = [];
  timers.push(setInterval(() => { if(sessao) carregar(); }, 3000));                       // atualiza a tela
  timers.push(setInterval(() => { if(sessao && loja && loja.aberta) rpc('painel_sinal', {p_loja: LOJA}).catch(() => {}); }, 60000)); // sinal de vida
  timers.push(setInterval(() => { if(sessao && ativos.some(p => p.status === 'novo')) tocarPedido(); }, 7000));   // repete até tocar em Recebi
  timers.push(setInterval(() => { if(sessao && ativos.some(semImpressao)) tocarAlerta(); }, 20000));              // aviso de impressão
  timers.push(setInterval(() => { if(sessao && atendimentos.some(c => !atendSilenciados.has(c.id))) tocarAtendimento(); }, INTERVALO_ATEND));   // bips ate alguem ver
}

$('formLogin').addEventListener('submit', async (ev) => {
  ev.preventDefault(); prepararSom();
  $('erroLogin').textContent = '';
  const ok = await entrar($('email').value.trim(), $('senha').value);
  if(!ok){ $('erroLogin').textContent = 'E-mail ou senha incorretos.'; return; }
  $('senha').value = ''; iniciarPainel(); ligarTimers();
});
$('btnLoja').addEventListener('click', alternarLoja);
$('btnSom').addEventListener('click', () => { prepararSom(); tocarPedido(); });
$('btnFeitos').addEventListener('click', () => { mostrarFeitos = !mostrarFeitos; desenhar(); });
$('btnSair').addEventListener('click', () => { timers.forEach(clearInterval); sair(); });
/* qualquer clique na página já liga o som (o Chrome só libera áudio depois de um clique de verdade) */
document.addEventListener('click', () => {
  if(!somAtivo || !ctxAudio) prepararSom();
  else if(ctxAudio.state !== 'running') ctxAudio.resume().catch(() => {});
  atualizarBotaoSom();
});

(function retomar(){
  try{
    const s = JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null');
    if(s && s.refresh_token){ sessao = s; iniciarPainel(); ligarTimers(); renovar().then(ok => { if(ok === false) sair(); }); }
  }catch(e){}
})();
</script>
