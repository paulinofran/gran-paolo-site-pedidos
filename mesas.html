<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PDV — Gran Paolo</title>
<style>
:root{--bg:#FAF4EC;--card:#fff;--ink:#2A1D15;--soft:#7A6A5C;--line:#EADFD0;--verde:#02341b;--vermelho:#ee4152;
  --ok:#1f7a45;--okbg:#DFF0E4;--am:#8a5a00;--ambg:#FFF1CC;--rd:#b3261e;--rdbg:#FCE0DD;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.oculto{display:none !important}
#login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
#login h1{margin:0 0 4px;font-size:22px;color:var(--verde)}
#login p{margin:0 0 16px;color:var(--soft);font-size:14px}
#login label{display:block;font-size:13px;color:var(--soft);margin:12px 0 4px}
#login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px}
#login button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--vermelho);color:#fff;font-size:16px;font-weight:700}
#erroLogin{color:var(--rd);font-size:14px;margin-top:10px;min-height:18px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--verde);color:#fff;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:18px}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;background:#fff;color:var(--verde);border:1.5px solid var(--line)}
.btn.verm{background:var(--vermelho);color:#fff;border-color:var(--vermelho)}
.btn.verde{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.peq{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5}
main{padding:14px;max-width:1100px;margin:0 auto}
.dica{color:var(--soft);font-size:14px;margin:0 0 12px}
/* grade */
#grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mesa{border:2px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;background:#fff;min-height:112px;font-weight:800}
.mesa .n{font-size:22px}
.mesa .s{font-size:13px;font-weight:600;margin-top:6px;color:var(--soft)}
.mesa.livre{border-color:#9ccfae;background:var(--okbg);color:var(--ok)}
.mesa.ocupada{border-color:#e0928c;background:var(--rdbg);color:var(--rd)}
.mesa.ocupada .s{color:var(--rd)}
.mesa.pediu{border-color:#d6a73b;background:var(--ambg);color:var(--am)}
/* mesa */
.topo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.topo h2{margin:0;font-size:22px;flex:1;min-width:120px}
select,input[type=text],input[type=number],textarea{font-family:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:9px 15px;font-weight:700;color:var(--soft);white-space:nowrap}
.chip.ativa{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:84px}
.prod b{display:block;font-size:15px}
.prod span{font-size:13px;color:var(--soft)}
.prod.esgotado{opacity:.45}
.bloco{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.bloco h3{margin:0 0 8px;font-size:16px}
.linha{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.linha:last-child{border-bottom:0}
.linha small{color:var(--soft);display:block}
.ped{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.ped .cab{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px}
.tag{font-size:12px;font-weight:700;border-radius:12px;padding:2px 8px;background:var(--azulbg,#DDEBFA);color:#1b5fa8}
#barraCarrinho{position:fixed;left:0;right:0;bottom:0;background:var(--verde);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:30}
#barraCarrinho .btn{background:var(--vermelho);color:#fff;border-color:var(--vermelho)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.janela{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:700px){.fundo{align-items:center}.janela{border-radius:18px}}
.janela h3{margin:0 0 4px;font-size:20px}
.janela .sub{color:var(--soft);font-size:14px;margin-bottom:10px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.opc{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.opc.sel{border-color:var(--vermelho);background:#fff0f1;color:var(--vermelho)}
.rot{font-size:13px;font-weight:700;color:var(--soft);margin:10px 0 2px}
.qtd{display:flex;align-items:center;gap:14px;margin:8px 0}
.qtd button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:800}
.qtd span{font-size:20px;font-weight:800;min-width:24px;text-align:center}
.acoes{display:flex;gap:8px;margin-top:14px}
.acoes .btn{flex:1}
.campo2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo2 label{font-size:13px;color:var(--soft);display:block}
.campo2 input{width:100%}
.total{font-size:20px;font-weight:800;display:flex;justify-content:space-between;margin-top:10px}
#aviso{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:15px;max-width:92vw}
/* tela inicial */
#inicio{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:6px}
.gt{border:2px solid var(--line);border-radius:20px;padding:22px 12px;text-align:center;background:#fff;min-height:150px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.gt .ic{font-size:44px;line-height:1}
.gt .n{font-size:22px}
.gt .s{font-size:14px;font-weight:600}
.gt.drive{background:#E6EEFA;border-color:#9db8e6;color:#1b5fa8}
.gt.entrega{background:#FFF1CC;border-color:#d6a73b;color:#8a5a00}
.gt.mesas{background:var(--okbg);border-color:#9ccfae;color:var(--ok)}
.gt.retirada{background:#F1E6F8;border-color:#c9a6e0;color:#6a2c91}
.gt.ocupa{box-shadow:0 0 0 3px rgba(238,65,82,.35)}
@media(min-width:900px){#inicio{grid-template-columns:repeat(4,1fr)}}
.sec{margin:14px 0 4px;font-size:14px;font-weight:800;color:var(--soft)}
.cli{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:16px;font-weight:700}
.cli small{display:block;color:var(--soft);font-weight:600}
.opc.pgto{flex:1 1 45%;min-height:64px;padding:16px 10px;font-size:19px;border-radius:14px}
.busca-lista{max-height:210px;overflow:auto;border:1.5px solid var(--line);border-radius:10px;margin-top:6px}
.busca-item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:11px 12px;font-size:15px}
.busca-item.sel{background:#fff0f1;color:var(--vermelho);font-weight:800}
.busca-sel{margin-top:6px;font-weight:800;color:var(--ok);font-size:15px}
#lateral{position:fixed;right:0;top:56px;bottom:0;width:350px;background:#fff;border-left:2px solid var(--line);z-index:25;display:flex;flex-direction:column;padding:14px}
#lateral h3{margin:0 0 8px;font-size:18px}
#lateral .itens{flex:1;overflow:auto}
#lateral .rodape{border-top:2px solid var(--line);padding-top:8px}
body.comLateral main{margin:0;max-width:none;padding-right:366px}
@media print{header,#barraCarrinho,.acoes,.fundo .btn{display:none}.fundo{position:static;background:none}.janela{max-height:none;box-shadow:none}}
.ac-lista{position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid #d9d2c3;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:4px;max-height:260px;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.ac-item{padding:11px 14px;cursor:pointer;border-bottom:1px solid #f0ebe0;line-height:1.25;color:#222}
.ac-item:last-of-type{border-bottom:0}
.ac-item:hover,.ac-item:active{background:#fff3e6}
.ac-item b{display:block;font-size:15px}
.ac-item span{font-size:12.5px;color:#7a7468}
.ac-rodape{padding:6px 14px;font-size:11px;color:#8a8478;text-align:right;background:#faf7f0}

</style>
</head>
<body>

<div id="login">
  <h1>Gran Paolo</h1>
  <p>PDV: Drive-thru, entregas, mesas e retirada. Use o mesmo usuário do painel de pedidos.</p>
  <form id="formLogin">
    <label for="email">E-mail</label>
    <input id="email" type="email" value="painel@granpaolopizzaria.com.br" autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <div id="erroLogin"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="oculto">
  <header>
    <h1>Gran Paolo · PDV</h1>
    <div class="barra">
      <button class="btn peq oculto" id="btnInicio">🏠 Início</button>
      <button class="btn peq" id="btnSite">Pedidos do site</button>
      <button class="btn peq" id="btnAtualizar">Atualizar</button>
      <a class="btn peq" href="painel.html" target="painel" rel="noopener" style="text-decoration:none">Painel</a>
      <button class="btn peq" id="btnSair">Sair</button>
    </div>
  </header>
  <main id="conteudo"></main>
</div>
<div id="barraCarrinho" class="oculto"></div>
<div id="lateral" class="oculto"></div>
<div id="aviso" class="oculto"></div>
<div id="modais"></div>

<script>
const SUPABASE_URL = "https://shhdqvhjvtwoviiqtxng.supabase.co";
const SUPABASE_KEY = "sb_publishable_qpfP7hAj0tmvwVEEqkqluA_iKzPYFUJ";
const LOJA = "gran-paolo";
const CHAVE_SESSAO = "gp_painel_sessao";      // a mesma do painel: entrou lá, entrou aqui
const QTD_MESAS = 10;
const MESAS = ['Balcao'].concat(Array.from({length:QTD_MESAS}, (_,i)=>String(i+1)));
const FORMAS = ['Pix','Dinheiro','Débito','Crédito'];
const RAPIDOS = {Drive:{rot:'Drive-thru', ic:'🚗'}, Retirada:{rot:'Retirada', ic:'🥡'}};   // um cliente por vez: nome + telefone, paga na hora
const ehRapido = (m)=> !!RAPIDOS[m];

let sessao = null, MENU = null, contas = [], pedSite = [], timer = null, entrega = null;
let tela = 'inicio', mesaAtual = null, comandaAtual = 'Comanda 1', detalhe = null, catAtiva = null, carrinho = [];

const $ = (id)=>document.getElementById(id);
// ---- Sugestões de endereço (Google Places API New, direto do navegador) ----
// A chave só funciona nos sites da Gran Paolo (trava por endereço no Google Cloud). Se o Google falhar, o campo segue livre.
const GMAPS_KEY = 'AIzaSyBYkjOgBGF31vPY43qop_N3sUCiOEg0vTE';
function gpSemAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function gpAutocompleteEndereco(cfg){
  const inp = cfg.input; if(!inp || !GMAPS_KEY || !window.fetch) return;
  const pai = inp.parentNode; if(getComputedStyle(pai).position === 'static') pai.style.position = 'relative';
  const lista = document.createElement('div'); lista.className = 'ac-lista'; pai.appendChild(lista);
  const novoToken = ()=> (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(16) + Math.random().toString(16).slice(2));
  let token = novoToken(), timer = null, ctrl = null, seq = 0, falhas = 0, chamadas = 0;
  const fechar = ()=>{ lista.style.display = 'none'; lista.innerHTML = ''; };
  const HDR = {'Content-Type':'application/json','X-Goog-Api-Key':GMAPS_KEY};
  async function buscar(q){
    if(falhas >= 3 || chamadas >= 20) return;
    const meu = ++seq; chamadas++;
    try{
      if(ctrl) ctrl.abort(); ctrl = new AbortController();
      const r = await fetch('https://places.googleapis.com/v1/places:autocomplete', {method:'POST', signal:ctrl.signal, headers:HDR,
        body: JSON.stringify({input:q, sessionToken:token, languageCode:'pt-BR', regionCode:'br', includedRegionCodes:['br'],
          locationBias:{circle:{center:{latitude:-5.8674,longitude:-35.2039}, radius:30000}}})});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); if(meu !== seq) return; falhas = 0;
      const sug = (j.suggestions || []).filter(s=>s.placePrediction).slice(0,6);
      lista.innerHTML = '';
      if(!sug.length){ fechar(); return; }
      sug.forEach(s=>{
        const p = s.placePrediction, sf = p.structuredFormat || {};
        const it = document.createElement('div'); it.className = 'ac-item';
        const b = document.createElement('b'); b.textContent = (sf.mainText && sf.mainText.text) || (p.text && p.text.text) || '';
        const sp = document.createElement('span'); sp.textContent = (sf.secondaryText && sf.secondaryText.text) || '';
        it.appendChild(b); it.appendChild(sp);
        it.addEventListener('mousedown', ev=>{ ev.preventDefault(); escolher(p.placeId); });   // mousedown: roda antes do campo perder o foco
        it.addEventListener('touchend', ev=>{ ev.preventDefault(); escolher(p.placeId); });
        lista.appendChild(it);
      });
      const rod = document.createElement('div'); rod.className = 'ac-rodape'; rod.textContent = 'powered by Google'; lista.appendChild(rod);
      lista.style.display = 'block';
    }catch(e){ if(e && e.name === 'AbortError') return; falhas++; fechar(); try{ console.warn('Sugestões de endereço indisponíveis:', e.message || e); }catch(_){} }
  }
  let escolhendo = false;
  async function escolher(id){
    if(escolhendo) return; escolhendo = true; setTimeout(()=>{ escolhendo = false; }, 800);
    fechar();
    try{
      const r = await fetch('https://places.googleapis.com/v1/places/' + encodeURIComponent(id) + '?languageCode=pt-BR&sessionToken=' + encodeURIComponent(token),
        {headers:{'X-Goog-Api-Key':GMAPS_KEY, 'X-Goog-FieldMask':'addressComponents,formattedAddress,location'}});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const comp = t => { const c = (d.addressComponents||[]).find(x=>(x.types||[]).includes(t)); return c ? c.longText : ''; };
      const rua = comp('route'), num = comp('street_number');
      const bairro = comp('sublocality_level_1') || comp('sublocality') || comp('neighborhood');
      const cidade = comp('administrative_area_level_2') || comp('locality');
      let texto = rua || String(d.formattedAddress||'').split(' - ')[0];
      texto += num ? ', ' + num : (cfg.semNumero ? ', ' + cfg.semNumero : ', ');
      inp.value = texto;
      inp.dispatchEvent(new Event('change', {bubbles:true}));
      if(cfg.onEscolhido) cfg.onEscolhido({rua, numero:num, bairro, cidade, formatado:d.formattedAddress||'', lat:d.location && d.location.latitude, lng:d.location && d.location.longitude});
      inp.focus(); try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(_){}
    }catch(e){ falhas++; try{ console.warn('Não consegui os detalhes do endereço:', e.message || e); }catch(_){} }
    token = novoToken(); chamadas = 0;    // sessão nova a cada endereço escolhido
  }
  inp.setAttribute('autocomplete', 'nope'); inp.setAttribute('name', 'gp-busca-' + Math.random().toString(36).slice(2,8)); inp.setAttribute('autocapitalize','words'); inp.setAttribute('spellcheck','false');
  inp.addEventListener('input', ()=>{
    clearTimeout(timer); const q = inp.value.trim();
    if(q.length < 4){ fechar(); return; }
    timer = setTimeout(()=>buscar(q), 320);
  });
  inp.addEventListener('blur', ()=>setTimeout(fechar, 180));
  inp.addEventListener('keydown', ev=>{ if(ev.key === 'Escape') fechar(); });
}


const el = (tag, cls, txt)=>{ const e = document.createElement(tag); if(cls) e.className = cls; if(txt !== undefined) e.textContent = txt; return e; };
const money = (v)=>'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rotMesa = (m)=> m === 'Balcao' ? 'Balcão' : RAPIDOS[m] ? RAPIDOS[m].rot : m === 'Entrega' ? 'Entrega' : 'Mesa ' + m;
const telaBase = ()=> (ehRapido(mesaAtual) || mesaAtual === 'Entrega') ? 'inicio' : 'grade';
const arred = (v)=>Math.round(v*100)/100;
const endCompleto = (e)=> e.endereco + (e.complemento ? ' - ' + e.complemento : '');
const semAcento = (t)=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function num(v){   // aceita 60,00 | 60.00 | 59.9 | 1.234,56 | 1,234.56 | 1.000
  let t = String(v||'').trim().replace(/[^0-9.,]/g,''); if(!t) return 0;
  const ic = t.lastIndexOf(','), ip = t.lastIndexOf('.');
  if(ic >= 0 && ip >= 0){ if(ic > ip) t = t.replace(/\./g,'').replace(',','.'); else t = t.replace(/,/g,''); }   // o último símbolo é o decimal
  else if(ic >= 0){ t = (t.split(',').length > 2) ? t.replace(/,/g,'') : t.replace(',','.'); }
  else if(ip >= 0){ const partes = t.split('.'); if(partes.length > 2 || (partes.length === 2 && partes[1].length === 3 && partes[0].length >= 1 && partes[0] !== '0')) t = t.replace(/\./g,''); }   // 1.000 = mil; 60.00 e 59.9 = decimal
  const n = parseFloat(t); return isFinite(n) ? n : 0;
}
function aviso(t){ const a = $('aviso'); a.textContent = t; a.classList.remove('oculto'); clearTimeout(aviso.t); aviso.t = setTimeout(()=>a.classList.add('oculto'), 3500); }

/* ---------- acesso (igual ao painel) ---------- */
function salvarSessao(j){ sessao = {access_token:j.access_token, refresh_token:j.refresh_token, expira:Date.now()+(j.expires_in||3600)*1000}; try{ localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao)); }catch(e){} }
async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
  if(!r.ok) return false; salvarSessao(await r.json()); return true;
}
async function renovar(){
  if(!sessao || !sessao.refresh_token) return false;
  try{
    const r = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sessao.refresh_token})});
    if(!r.ok) return false; salvarSessao(await r.json()); return true;
  }catch(e){ return null; }
}
function sair(){ sessao = null; clearInterval(timer); try{ localStorage.removeItem(CHAVE_SESSAO); }catch(e){} $('app').classList.add('oculto'); $('barraCarrinho').classList.add('oculto'); $('login').classList.remove('oculto'); }
async function rpc(nome, args, jaRenovou){
  if(sessao && sessao.expira - Date.now() < 120000 && !jaRenovou) await renovar();
  const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/'+nome,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Authorization:'Bearer '+(sessao?sessao.access_token:SUPABASE_KEY)},body:JSON.stringify(args||{})});
  if(r.status === 401 && !jaRenovou && await renovar()) return rpc(nome, args, true);
  if(r.status === 401){ sair(); throw new Error('sessão expirada'); }
  const t = await r.text(); let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok) throw new Error((j && (j.message||j.hint)) || ('erro ' + r.status));
  return j;
}

/* ---------- dados ---------- */
async function carregarMenu(){
  const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/cardapio_publico',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_loja:LOJA})});
  if(r.ok) MENU = await r.json();
}
const ehPizza = (c)=> c.tipo === 'pizza';
const nomeProd = (c,p)=> ehPizza(c) ? 'Pizza ' + p.nome : p.nome;
function categorias(){
  const base = ((MENU && MENU.categorias) || []).map(c=>({...c, produtos:(c.produtos||[]).filter(p=>(p.disponivel||p.esgotado) && (p.tamanhos||[]).length)})).filter(c=>c.produtos.length);
  // "Tradicionais" e "Especiais" viram uma lista só: Pizzas Salgadas (so na tela; o banco continua igual)

  const pagos = (detalhe.pagamentos || []), recebido = pagos.reduce((a,g)=>a+Number(g.valor),0);
  const bpg = el('div','bloco'); bpg.style.marginTop = '12px'; bpg.appendChild(el('h3','','Pagamento'));
  pagos.forEach(g=>{ const l = el('div','linha'); l.appendChild(el('span','', g.forma)); const d = el('div'); d.style.cssText = 'display:flex;gap:8px;align-items:center';
    d.appendChild(el('span','',money(g.valor))); const x = el('button','btn peq','Desfazer'); x.onclick = async ()=>{ try{ await rpc('mesa_desfazer_pagamento',{p_loja:LOJA,p_pagamento:g.id}); await carregarDetalhe(); fechar(); abrirConta(); }catch(e){ aviso(e.message); } }; d.appendChild(x); l.appendChild(d); bpg.appendChild(l); });
  const tfalta = el('div','total'); bpg.appendChild(tfalta);
  bpg.appendChild(el('div','rot','Valor que o cliente entregou agora'));
  const iVal = el('input'); iVal.type = 'text'; iVal.inputMode = 'decimal'; iVal.style.width = '100%'; bpg.appendChild(iVal);
  const tTroco = el('div','total'); tTroco.style.cssText = 'display:none;background:#fff3cd;color:#7a4b00;margin-top:8px;font-size:1.15em'; bpg.appendChild(tTroco);
  bpg.appendChild(el('div','rot','Forma de pagamento'));
  let forma = null; const of = el('div','opcoes'); FORMAS.forEach(f=>{ const b = el('button','opc pgto',f); b.onclick = ()=>{ forma = f; of.querySelectorAll('.opc').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); atualizaPag(); }; of.appendChild(b); }); bpg.appendChild(of);
  const bRec = el('button','btn verde'); bRec.style.width = '100%'; bpg.appendChild(bRec);
  j.appendChild(bpg);
  const falta = ()=> arred(recalcula() - recebido);
  function atualizaPag(){ const f = falta(); tfalta.innerHTML = ''; tfalta.appendChild(el('span','', f > 0.009 ? 'Falta receber' : 'Tudo recebido')); tfalta.appendChild(el('span','', money(Math.max(f,0))));
    const v = num(iVal.value); bRec.textContent = f <= 0.009 ? 'Fechar conta' : (v >= f - 0.005 ? 'Receber e fechar conta' : 'Receber este valor (parcial)');
    const tr = trocoAtual(); tTroco.innerHTML = ''; if(tr > 0.009){ tTroco.style.display = 'flex'; tTroco.appendChild(el('span','','Troco a devolver')); tTroco.appendChild(el('span','',money(tr))); } else tTroco.style.display = 'none'; }
  function trocoAtual(){ const f = falta(), v = num(iVal.value); return (forma === 'Dinheiro' && f > 0.009 && v > f + 0.005) ? arred(v - f) : 0; }
  iVal.value = String(Math.max(falta(),0).toFixed(2)).replace('.',','); iDesc.addEventListener('input', ()=>{ iVal.value = String(Math.max(falta(),0).toFixed(2)).replace('.',','); atualizaPag(); }); iAcr.addEventListener('input', ()=>{ iVal.value = String(Math.max(falta(),0).toFixed(2)).replace('.',','); atualizaPag(); });
  iVal.oninput = atualizaPag; atualizaPag();
  bRec.onclick = async ()=>{
    const f = falta(), v = num(iVal.value), fecha = f <= 0.009 || v >= f - 0.005;
    if(f > 0.009 && !forma){ aviso('Escolha a forma de pagamento.'); return; }
    if(f > 0.009 && v <= 0){ aviso('Informe o valor.'); return; }
    const troco = trocoAtual();
    if(fecha && !confirm('Fechar a conta de ' + rotMesa(mesaAtual) + ' em ' + money(recalcula()) + '?' + (troco > 0 ? '\n\nTROCO A DEVOLVER: ' + money(troco) : ''))) return;
    bRec.disabled = true;
    try{
      const dados = {desconto:num(iDesc.value),acrescimo:num(iAcr.value),taxa_servico:taxa};
      await rpc('mesa_atualizar',{p_loja:LOJA,p_conta:conta.id,p_dados:dados});
      if(f > 0.009) await rpc('mesa_receber',{p_loja:LOJA,p_conta:conta.id,p_valor:Math.min(v, f),p_forma:forma,p_entregue:(forma === 'Dinheiro' && v > f + 0.005) ? v : null});
      if(fecha){ const rf = await rpc('mesa_fechar',{p_loja:LOJA,p_conta:conta.id,p_forma:forma,p_desconto:dados.desconto,p_acrescimo:dados.acrescimo,p_taxa:taxa}) || {};
        const ganhou = (Number(rf.cashback_ganho) > 0 || Number(rf.pontos_ganhos) > 0) ? ' Cliente ganhou ' + (Number(rf.cashback_ganho) > 0 ? money(Number(rf.cashback_ganho)) + ' de cashback' : '') + (Number(rf.cashback_ganho) > 0 && Number(rf.pontos_ganhos) > 0 ? ' e ' : '') + (Number(rf.pontos_ganhos) > 0 ? rf.pontos_ganhos + ' ponto(s)' : '') + '.' : '';
        fechar(); aviso((ehRapido(mesaAtual) ? 'Atendimento finalizado.' : 'Conta fechada. Mesa livre.') + (troco > 0 ? ' Troco: ' + money(troco) + '.' : '') + ganhou); if(troco > 0 || ganhou){ clearTimeout(aviso.t); aviso.t = setTimeout(()=>$('aviso').classList.add('oculto'), 9000); } tela = telaBase(); carrinho = []; await atualizarContas(); desenhar(); }
      else{ await carregarDetalhe(); fechar(); aviso('Recebido ' + money(v) + ' em ' + forma + '.'); abrirConta(); }
    }catch(e){ bRec.disabled = false; aviso('Não consegui: ' + e.message); }
  };
  const ac = el('div','acoes');
  const bv = el('button','btn','Voltar'); bv.onclick = fechar;
  const bp = el('button','btn','Cliente pediu a conta'); bp.onclick = async ()=>{ try{ await rpc('mesa_atualizar',{p_loja:LOJA,p_conta:conta.id,p_dados:{desconto:num(iDesc.value),acrescimo:num(iAcr.value),taxa_servico:taxa,pedir_conta:'true'}}); await atualizarContas(); fechar(); aviso('Marcado: o cliente pediu a conta. Para conferir na mesa, use Imprimir conta.'); }catch(e){ aviso(e.message); } };
  const bi = el('button','btn','🖨 Imprimir conta');
  bi.onclick = async ()=>{ bi.disabled = true; try{ await rpc('mesa_imprimir_preconta',{p_loja:LOJA,p_conta:conta.id,p_desconto:num(iDesc.value),p_acrescimo:num(iAcr.value)}); await atualizarContas(); aviso('Conta enviada para a impressora do caixa (sem fechar).'); }catch(e){ aviso('Não consegui imprimir: ' + e.message + (/function|does not exist|mesa_imprimir_preconta/i.test(e.message) ? ' (falta instalar a Parte AP)' : '')); } bi.disabled = false; };
  ac.appendChild(bv); ac.appendChild(bi); if(!ehRapido(mesaAtual)) ac.appendChild(bp); j.appendChild(ac);
}

/* ---------- início ---------- */
async function iniciar(){
  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  tela = 'inicio'; mesaAtual = null; entrega = null; carrinho = []; detalhe = null;
  await Promise.all([carregarMenu(), atualizarContas()]);
  desenhar();
  clearInterval(timer); timer = setInterval(async ()=>{ if((tela==='grade' || tela==='inicio') && !$('modais').children.length){ await atualizarContas(); desenhar(); } }, 20000);
}
$('formLogin').addEventListener('submit', async e=>{ e.preventDefault(); $('erroLogin').textContent = '';
  if(await entrar($('email').value.trim(), $('senha').value)){ $('senha').value = ''; iniciar(); } else $('erroLogin').textContent = 'E-mail ou senha não conferem.'; });
$('btnSair').onclick = sair;
$('btnInicio').onclick = irInicio;
$('btnSite').onclick = async ()=>{ await atualizarContas(); abrirPedidosSite(); };
$('btnAtualizar').onclick = async ()=>{ await Promise.all([carregarMenu(), atualizarContas()]); if(tela==='mesa') await carregarDetalhe(); desenhar(); aviso('Atualizado.'); };
(function retomar(){
  try{ const s = JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null'); if(s && s.refresh_token){ sessao = s; renovar().then(ok=>{ if(ok === false) sair(); else iniciar(); }); } }catch(e){}
})();
</script>
