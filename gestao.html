<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestão — Gran Paolo</title>
<style>
:root{--bg:#FAF4EC;--card:#fff;--ink:#2A1D15;--soft:#7A6A5C;--line:#EADFD0;--verde:#02341b;--vermelho:#ee4152;
  --ok:#1f7a45;--okbg:#DFF0E4;--am:#8a5a00;--ambg:#FFF1CC;--rd:#b3261e;--rdbg:#FCE0DD;--azul:#1b5fa8;--azulbg:#DDEBFA;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
.oculto{display:none !important}
#login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
#login h1{margin:0 0 4px;font-size:22px;color:var(--verde)}
#login p{margin:0 0 16px;color:var(--soft);font-size:14px}
#login label{display:block;font-size:13px;color:var(--soft);margin:12px 0 4px}
#login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px}
#login button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--vermelho);color:#fff;font-size:16px;font-weight:700}
#erroLogin{color:var(--rd);font-size:14px;margin-top:10px;min-height:18px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--verde);color:#fff}
header h1{margin:0;font-size:18px}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none;display:inline-block}
.btn.claro{background:#fff;color:var(--verde)}
.btn.vermelho{background:var(--vermelho);color:#fff}
.btn.verde{background:var(--verde);color:#fff}
.btn.cinza{background:#EFE6DA;color:var(--ink)}
.btn.peq{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5}
#abas{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#abas button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;color:var(--soft);white-space:nowrap}
#abas button.ativa{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
#avisoNotas{display:none;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:1px solid var(--line);line-height:1.35}
#avisoNotas.erro{display:block;background:var(--rdbg);color:var(--rd)}
#avisoNotas.espera{display:block;background:var(--ambg);color:var(--am)}
#abas button .selo{display:inline-block;margin-left:6px;min-width:18px;padding:0 6px;border-radius:10px;background:var(--rd);color:#fff;font-size:12px;line-height:18px;text-align:center}
#abas button.ativa .selo{background:#fff;color:var(--vermelho)}
#aviso{position:fixed;left:12px;right:12px;bottom:14px;z-index:20;max-width:520px;margin:0 auto}
.toast{padding:12px 14px;border-radius:12px;font-weight:700;margin-top:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.ok{background:var(--ok);color:#fff}.toast.erro{background:var(--rd);color:#fff}
main{padding:14px 12px 90px;max-width:760px;margin:0 auto}
h2{font-size:16px;margin:18px 0 8px;color:var(--verde)}
h2:first-child{margin-top:4px}
.dica{font-size:13px;color:var(--soft);margin:2px 0 10px;line-height:1.4}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nome{font-weight:800;font-size:16px}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.nao{background:var(--rdbg);color:var(--rd)}.chip.am{background:var(--ambg);color:var(--am)}.chip.az{background:var(--azulbg);color:var(--azul)}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.campo{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--soft);font-weight:600}
.campo input,.campo select,.campo textarea{padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);font-size:15px;min-width:0}
.campo input.num{width:96px}
.campo textarea{width:100%;min-height:62px}
.cheios{display:flex;gap:6px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);background:#F7F1E8;border-radius:9px;padding:6px 9px}
.marca input{width:17px;height:17px}
.dia{border:1.5px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px;font-weight:800;color:var(--soft)}
.dia.sel{background:var(--verde);border-color:var(--verde);color:#fff}
.busca{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:8px;background:#fff}
.vazio{padding:18px;border:1.5px dashed var(--line);border-radius:12px;color:var(--soft);text-align:center}
details>summary{cursor:pointer;color:var(--azul);font-weight:700;font-size:13px;margin-top:8px}
.extrato td,.extrato th{padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
.extrato{width:100%;border-collapse:collapse}
.saldo{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.saldo div{flex:1;min-width:130px;background:#F1FAF3;border:1px solid #BFE3C8;border-radius:12px;padding:10px;font-weight:800;font-size:18px;color:#14502B}
.saldo small{display:block;font-weight:600;font-size:12px;color:#3B6B4B}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--rd);font-weight:700}
/* ---- painel (visao geral) ---- */
main.larga{max-width:1080px}
.pn-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 14px}
.pn-barra .cheios{margin:0}
.pn-sub{font-size:13px;color:var(--soft)}
.pn-grade{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:12px;align-items:start}.pn-grade.hero{align-items:stretch}
@media(min-width:820px){.pn-grade.dois{grid-template-columns:1fr 1fr}.pn-grade.tres{grid-template-columns:repeat(3,1fr)}.pn-grade.hero{grid-template-columns:1.25fr 1fr}}
.pn-hero{background:linear-gradient(135deg,#02341b 0%,#0e5a35 100%);color:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 10px 28px rgba(2,52,27,.20);display:flex;flex-direction:column;justify-content:center;min-height:170px}
.pn-hero small{font-size:13px;font-weight:600;color:#bfe3cc;letter-spacing:.2px}
.pn-hero .grande{font-size:clamp(40px,8vw,56px);font-weight:800;line-height:1.05;margin:6px 0 10px;letter-spacing:-1px}
.pn-delta{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pn-delta.sobe{background:#DFF0E4;color:#14502B}.pn-delta.desce{background:#FCE0DD;color:#b3261e}.pn-delta.igual{background:#EFE6DA;color:#7A6A5C}
.pn-hero .pn-delta.sobe{background:rgba(255,255,255,.16);color:#d9f6e3}.pn-hero .pn-delta.desce{background:rgba(255,255,255,.16);color:#ffd9d4}.pn-hero .pn-delta.igual{background:rgba(255,255,255,.14);color:#dfe9e3}
.pn-hero .pn-ref{font-size:12.5px;color:#bfe3cc;margin-top:8px}
.pn-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pn-tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 2px 10px rgba(42,29,21,.04);display:flex;flex-direction:column;gap:2px;min-width:0}
.pn-tile .rot{font-size:12.5px;color:var(--soft);font-weight:600}
.pn-tile .val{white-space:nowrap;font-size:clamp(17px,3.9vw,25px);font-weight:800;color:var(--verde);line-height:1.15;margin:2px 0 6px;letter-spacing:-.4px}
.pn-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:0 2px 10px rgba(42,29,21,.04);min-width:0}
.pn-card h3{margin:0;font-size:15px;color:var(--verde)}
.pn-card .pn-sub{margin:2px 0 12px}
.pn-card svg{display:block;width:100%;height:auto;overflow:visible}
.pn-vazio{padding:16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--soft);text-align:center;font-size:13.5px}
.hb{display:grid;grid-template-columns:minmax(84px,34%) 1fr auto;gap:10px;align-items:center;padding:6px 0}
.hb .rot{font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trilho{height:10px;border-radius:5px;background:#F1EADF;overflow:hidden}
.hb .barra-h{height:100%;border-radius:5px;background:var(--verde)}
.hb .num{font-size:13px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
.hb .num small{font-weight:600;color:var(--soft)}
.pn-calor{display:grid;gap:3px;align-items:center}
.pn-calor .c{height:26px;border-radius:5px;background:#F3EDE4}
.pn-calor .h{font-size:11px;color:var(--soft);text-align:center}
.pn-calor .d{font-size:12px;color:var(--soft);font-weight:700;padding-right:6px}
.pn-leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);margin-top:10px}
.pn-leg i{display:block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(2,52,27,.10),rgba(2,52,27,1))}
.pn-dupla{display:flex;height:22px;gap:2px}
.pn-dupla div{height:100%}
.pn-dupla div:first-child{border-radius:6px 0 0 6px}.pn-dupla div:last-child{border-radius:0 6px 6px 0}.pn-dupla div:only-child{border-radius:6px}
.pn-chaves{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px;color:var(--ink)}
.pn-chaves b{font-weight:800}
.pn-chaves .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pn-tip{position:fixed;z-index:50;display:none;background:#2A1D15;color:#fff;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:9px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:260px;line-height:1.35}
.pn-card details>summary{margin-top:10px}
.pn-link{font-size:13px;color:var(--azul);font-weight:700;background:none;border:0;padding:0;margin-top:10px;text-align:left}
</style>
</head>
<body>

<div id="login">
  <h1>Gran Paolo</h1>
  <p>Gestão do cardápio. Entre com o usuário do painel.</p>
  <form id="formLogin">
    <label for="email">E-mail</label>
    <input id="email" type="email" value="painel@granpaolopizzaria.com.br" autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <div id="erroLogin"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="oculto">
  <header>
    <h1>Gran Paolo · Gestão</h1>
    <div class="barra">
      <a class="btn claro peq" href="painel.html">Pedidos</a>
      <a class="btn claro peq" href="mesas.html">Mesas</a>
      <a class="btn claro peq" href="./" target="_blank" rel="noopener">Ver o site</a>
      <button id="btnSair" class="btn claro peq">Sair</button>
    </div>
  </header>
  <div id="avisoNotas" role="alert"></div>
  <div id="abas"></div>
  <main id="conteudo"><div class="vazio">Carregando...</div></main>
</div>
<div id="aviso"></div>

  const m = {}, ordem = [];

function salvarSessao(j){
  sessao = {access_token: j.access_token, refresh_token: j.refresh_token, expira: Date.now() + (j.expires_in || 3600) * 1000};
  try{ localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao)); }catch(e){}
}
async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email, password:senha})});

  salvarSessao(await r.json()); return true;
}
async function renovar(){
  if(!sessao || !sessao.refresh_token) return false;
  try{
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:sessao.refresh_token})});

}

async function api(caminho, opcoes = {}, jaRenovou = false){

  const r = await fetch(SUPABASE_URL + caminho, Object.assign({}, opcoes, {headers}));
  if(r.status === 401 && sessao && !jaRenovou){ if(await renovar()) return api(caminho, opcoes, true); sair(); throw new Error('sessão expirada'); }
  if(!r.ok) throw new Error((await r.text()) || ('erro ' + r.status));

}

}

/* ---------- datas (horario de Natal) ---------- */
function agoraLocal(){
  const p = {}; new Intl.DateTimeFormat('en-CA', {timeZone:'America/Fortaleza', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short'})
    .formatToParts(new Date()).forEach(x=>{ p[x.type] = x.value; });
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday);
  return {data:`${p.year}-${p.month}-${p.day}`, dow, hora:`${p.hour === '24' ? '00' : p.hour}:${p.minute}`};
}
function fimDoDia(){ return agoraLocal().data + 'T23:59:59-03:00'; }
function promoVale(pm){
  const h = agoraLocal();
  if(!pm.ativa) return false;
  if(pm.desligada_em === h.data) return false;
  if(pm.ligada_em === h.data) return true;
  const dia = !pm.dias || pm.dias.indexOf(h.dow) >= 0;
  const hora = !pm.hora_ini || !pm.hora_fim || (h.hora >= pm.hora_ini.slice(0,5) && h.hora <= pm.hora_fim.slice(0,5));
  return dia && hora;
}

/* ---------- aviso de notas fiscais com problema (so aparece com a nota LIGADA) ---------- */
// Vermelho: nota com ERRO ou parada na fila ha mais de 15 min (internet ou Focus fora do ar).
// Amarelo: nota esperando a forma de pagamento ha mais de 30 min. Olha so os ultimos 7 dias.
async function atualizarAvisoNotas(){
  const box = $('avisoNotas'); if(!box || PAPEL === 'leitor') return;
  let erros = 0, esperando = 0, paradas = 0, teste = false;
  try{
    const cfg = (await api(`/rest/v1/fiscal_config?loja_id=eq.${LOJA}&select=ativo,ambiente`) || [])[0];
    if(cfg && cfg.ativo){
      teste = cfg.ambiente !== 'producao';
      const desde = new Date(Date.now() - 7 * 86400000).toISOString();
      const lista = await api(`/rest/v1/notas_fiscais?loja_id=eq.${LOJA}&ambiente=eq.${cfg.ambiente}&criado_em=gte.${desde}&status=in.(erro,aguardando,pendente,enviando)&select=status,criado_em,atualizado_em&limit=200`) || [];
      const agora = Date.now();
      lista.forEach(n=>{
        if(n.status === 'erro') erros++;
        else if(n.status === 'aguardando'){ if(agora - new Date(n.criado_em).getTime() > 30 * 60000) esperando++; }
        else if(agora - new Date(n.atualizado_em).getTime() > 15 * 60000) paradas++;
      });
    }
  }catch(e){ return; }   // sem a Parte G, sem internet ou sessao vencida: nao mostra nada (e nao atrapalha)
  const antes = NOTAS_PROBLEMA; NOTAS_PROBLEMA = erros + esperando + paradas;
  const partes = [];
  if(erros) partes.push(erros === 1 ? '1 nota com erro' : erros + ' notas com erro');
  if(paradas) partes.push(paradas === 1 ? '1 nota parada na fila há mais de 15 min' : paradas + ' notas paradas na fila há mais de 15 min');
  if(esperando) partes.push(esperando === 1 ? '1 nota esperando a forma de pagamento' : esperando + ' notas esperando a forma de pagamento');
  if(!partes.length){ box.className = ''; box.textContent = ''; box.onclick = null; }
  else{
    box.className = (erros || paradas) ? 'erro' : 'espera';
    box.textContent = '⚠ ' + partes.join(' · ') + (teste ? ' (modo teste)' : '') + '. Toque aqui para ver.';
    box.onclick = ()=>{ aba = 'notas'; desenhar(); window.scrollTo(0, 0); };
  }
  if(antes !== NOTAS_PROBLEMA) desenharAbas();
}

const simPadrao = ()=>({nome:'', varPreco:0, pctGrande:70, dias:26, imp:0, cartao:0, roy:3, fundoPct:1, fundoMin:1000, enc:21.77, meta:0,

  folha:['Pizzaiolo', 'Atendente'].map(n=>({n, v:''})), extras:[{n:'Extra de fim de semana', v:''}]});

function simCarrega(){ if(SIM) return; SIM = simPadrao(); try{ const t = localStorage.getItem(SIM_CHAVE); if(t){ const o = JSON.parse(t); if(o && Array.isArray(o.fixas)) SIM = Object.assign(simPadrao(), o); } }catch(e){} }
function simSalva(){ try{ localStorage.setItem(SIM_CHAVE, JSON.stringify(SIM)); }catch(e){} }
// media de preco e custo das pizzas que tem ficha tecnica, por tamanho
function simProdutos(){
  const pizzas = (D.produtos || []).filter(p=>((D.categorias.find(c=>c.id === p.categoria_id) || {}).tipo === 'pizza') && p.ativo !== false);
  const lin = [], tam = {Grande:{p:0, c:0, n:0}, Pequena:{p:0, c:0, n:0}};
  pizzas.forEach(p=>{ (p.produto_tamanhos || []).forEach(t=>{ const pr = Number(t.preco), c = custoDe(p, t);
    if(!(pr > 0) || c === null) return; lin.push({nome:nomeProd(p), tam:t.nome, preco:pr, custo:c});
    if(tam[t.nome]){ tam[t.nome].p += pr; tam[t.nome].c += c; tam[t.nome].n++; } }); });
  ['Grande', 'Pequena'].forEach(k=>{ const x = tam[k]; if(x.n){ x.p /= x.n; x.c /= x.n; } });
  return {lin, tam, total:pizzas.length};
}
function simModelo(){
  const P = simProdutos(), g = Math.min(100, Math.max(0, SIM.pctGrande)) / 100, f = 1 + SIM.varPreco / 100;
  const tg = P.tam.Grande, tp = P.tam.Pequena;
  const gOk = tg.n > 0, pOk = tp.n > 0;
  const wg = gOk && pOk ? g : (gOk ? 1 : 0), wp = 1 - wg;
  const preco = (tg.p * wg + tp.p * wp) * f, cmv = tg.c * wg + tp.c * wp;
  const fixas = SIM.fixas.reduce((s, x)=>s + mtNum(x.v), 0);
  const folha = SIM.folha.reduce((s, x)=>s + mtNum(x.v), 0) * (1 + SIM.enc / 100) + SIM.extras.reduce((s, x)=>s + mtNum(x.v), 0) * 4.33;
  const pv = (SIM.imp + SIM.cartao + SIM.roy) / 100;
  const dias = Math.max(1, SIM.dias);
  const lucro = (n)=>{ const rev = n * preco, fundo = n > 0 ? Math.max(rev * SIM.fundoPct / 100, SIM.fundoMin) : 0;
    return rev - rev * pv - n * cmv - fundo - fixas - folha; };
  const resolve = (alvo)=>{ if(lucro(100000) < alvo) return null; let a = 0, b = 100000; for(let i = 0; i < 60; i++){ const m = (a + b) / 2; if(lucro(m) < alvo) a = m; else b = m; } return b; };
  return {P, preco, cmv, fixas, folha, pv, dias, lucro, resolve, custos:fixas + folha, contrib:preco * (1 - pv) - cmv};
}

// le o codigo do boleto (47 digitos da linha digitavel ou 44 do codigo de barras)
function lerBoleto(txt){
  let d = String(txt||'').replace(/\D/g,'');
  // conta de consumo (energia, agua, telefone...): comeca com 8. A linha digitavel tem 48 numeros (4 blocos de 11 + 1 digito verificador cada); o codigo de barras tem 44.
  if(d.length === 48 && d[0] === '8'){ d = [0,12,24,36].map(i=>d.slice(i, i+11)).join(''); }
  if(d.length === 44 && d[0] === '8'){
    const tipo = d[2], valorReal = '6789'.indexOf(tipo) >= 0;
    const valor = valorReal ? parseInt(d.slice(4,15)) / 100 : null;
    // nao existe um lugar padrao para o vencimento nas contas de consumo: voce digita
    return {ok:true, valor, venc:null, digitos:d, consumo:true};
  }
  let fator, cent;
  if(d.length === 47){ fator = parseInt(d.slice(33,37)); cent = parseInt(d.slice(37,47)); }
  else if(d.length === 44){ fator = parseInt(d.slice(5,9)); cent = parseInt(d.slice(9,19)); }
  else return {ok:false, motivo:'O código precisa ter 44, 47 ou 48 números. Encontrei ' + d.length + '.'};
  const valor = cent / 100; let venc = null;
  if(fator > 0){
    const base = fator >= 1000 ? new Date(Date.UTC(2025,1,22)) : new Date(Date.UTC(1997,9,7));   // desde 22/02/2025 o fator recomeça em 1000
    base.setUTCDate(base.getUTCDate() + (fator >= 1000 ? fator - 1000 : fator));
    venc = base.toISOString().slice(0,10);
  }
  return {ok:true, valor, venc, digitos:d};
}


// Procura o codigo de barras numa foto: tenta o leitor nativo do Chrome e depois a biblioteca, em varios tamanhos, giros e recortes.
async function lerCodigoImagem(arquivo, Z, aoProgresso){
  const ok = (t)=>{ const d = String(t||'').replace(/\D/g,''); return (d.length === 44 || d.length === 47 || d.length === 48) ? d : null; };
  let bmp;
  try{ bmp = await createImageBitmap(arquivo); }
  catch(e){ bmp = await new Promise((res, rej)=>{ const u = URL.createObjectURL(arquivo), im = new Image(); im.onload = ()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror = ()=>rej(new Error('Não consegui abrir essa imagem.')); im.src = u; }); }
  const W0 = bmp.width, H0 = bmp.height;
  // 1) leitor nativo do navegador (Chrome do Android tem), costuma ser o melhor
  try{
    if('BarcodeDetector' in window){
      const sup = await BarcodeDetector.getSupportedFormats();
      if(sup.indexOf('itf') >= 0){ const r = await new BarcodeDetector({formats:['itf']}).detect(bmp); for(const x of r){ const d = ok(x.rawValue); if(d) return d; } }
    }
  }catch(e){}
  // 2) biblioteca ZXing em varias tentativas
  const h = new Map(); h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.ITF]); h.set(Z.DecodeHintType.TRY_HARDER, true);
  const rd = new Z.MultiFormatReader(); rd.setHints(h);
  const tenta = (cv)=>{ try{ return ok(rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()); }catch(e){ return null; } };
  const pausa = ()=>new Promise(r=>setTimeout(r, 0));
  const limite = Date.now() + 40000;   // no maximo ~40 s procurando
  for(const fator of [1, 0.7, 0.5, 1.4]){
    const esc = Math.min(fator, 5200 / Math.max(W0, H0));
    for(const rot of [0, 90, 270, 180]){
      if(Date.now() > limite) return null;
      const w = Math.round(W0 * esc), hh = Math.round(H0 * esc), girado = rot === 90 || rot === 270;
      const cv = document.createElement('canvas'); cv.width = girado ? hh : w; cv.height = girado ? w : hh;
      const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.translate(cv.width / 2, cv.height / 2); cx.rotate(rot * Math.PI / 180); cx.drawImage(bmp, -w / 2, -hh / 2, w, hh);
      if(aoProgresso) aoProgresso();
      await pausa();
      let d = tenta(cv); if(d) return d;
      // faixas horizontais sobrepostas: o codigo costuma ser uma faixa estreita da pagina
      const n = 6, alt = Math.ceil(cv.height / 3);
      for(let i = 0; i < n; i++){
        const y = Math.round(i * Math.max(0, cv.height - alt) / (n - 1));
        const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = Math.min(alt, cv.height);
        c2.getContext('2d').drawImage(cv, 0, y, cv.width, c2.height, 0, 0, cv.width, c2.height);
        d = tenta(c2); if(d) return d;
        if(i % 2 === 1) await pausa();
      }
    }
  }
  return null;
}

// numero da empresa dentro do codigo de uma conta de consumo (segmento + identificacao da empresa): serve para lembrar o fornecedor
function chaveEmpresa(txt){
  let d = String(txt||'').replace(/\D/g,'');
  if(d.length === 48 && d[0] === '8') d = [0,12,24,36].map(i=>d.slice(i, i+11)).join('');
  return (d.length === 44 && d[0] === '8') ? d[1] + d.slice(15,19) : null;
}

// linha digitavel (47/48 numeros) a partir do codigo de barras (44): e a que o aplicativo do banco aceita digitada ou colada
function dv10(t){ let soma = 0, peso = 2; for(let i = t.length - 1; i >= 0; i--){ let p = Number(t[i]) * peso; if(p > 9) p = Math.floor(p / 10) + p % 10; soma += p; peso = peso === 2 ? 1 : 2; } const r = soma % 10; return r === 0 ? 0 : 10 - r; }
function dv11conv(t){ let soma = 0, peso = 2; for(let i = t.length - 1; i >= 0; i--){ soma += Number(t[i]) * peso; peso = peso === 9 ? 2 : peso + 1; } const dv = 11 - soma % 11; return dv > 9 ? 0 : dv; }
function linhaParaPagar(txt){
  const d = String(txt || '').replace(/\D/g, '');
  if(d.length === 44 && d[0] === '8'){ const f = '67'.indexOf(d[2]) >= 0 ? dv10 : dv11conv; return [0, 11, 22, 33].map(i=>{ const b = d.slice(i, i + 11); return b + f(b); }).join(''); }
  if(d.length === 44){ const c1 = d.slice(0, 4) + d.slice(19, 24), c2 = d.slice(24, 34), c3 = d.slice(34, 44); return c1 + dv10(c1) + c2 + dv10(c2) + c3 + dv10(c3) + d[4] + d.slice(5, 19); }
  return d;
}

let zxPromessa = null;
function carregarZxing(){

  return zxPromessa;
}

// Modelo simples: 6 campos. Regras fixas no banco: 1 uso por cliente, nao vale em promocao/combo, nao desconta entrega.
function dataCupom(iso){ return iso ? String(iso).slice(0,10).split('-').reverse().join('/') : ''; }
function resumoCupom(cp){
  const p = [];
  if(cp.tipo === 'libera'){ const pm = (D.promocoes||[]).find(x=>x.slug === cp.promocao_slug); p.push('libera a promoção "' + (pm ? pm.nome : cp.promocao_slug) + '"'); }
  else{
    const v = cp.tipo === 'percentual' ? (String(Number(cp.valor)).replace('.', ',') + '%') : money(cp.valor);
    p.push(v + ' de desconto');
    if(Number(cp.pedido_minimo) > 0) p.push('pedido mínimo ' + money(cp.pedido_minimo));
  }
  if(cp.valida_de || cp.valida_ate) p.push((cp.valida_de ? 'de ' + dataCupom(cp.valida_de) + ' ' : '') + (cp.valida_ate ? 'até ' + dataCupom(cp.valida_ate) : ''));
  p.push(cp.limite_usos ? cp.usos + ' de ' + cp.limite_usos + ' usos' : cp.usos + ' usos');
  if(cp.so_primeira_compra) p.push('só para quem nunca pediu');
  return p.join(' · ');
}

/* ---------- preco dos insumos + insumo novo ---------- */

    ins = await api('/rest/v1/est_insumos?select=id,nome,unidade,custo_por_g,ativo&loja_id=eq.' + LOJA + '&order=nome.asc&limit=1000');
  }catch(e){ lista.appendChild(el('div', 'vazio', 'Não consegui ler os insumos. O Estoque já foi instalado no banco (Parte J)?')); return; }
  let semBF = false;
  try{ (await rpc('est_insumo_precos_lista', {p_loja:LOJA}) || []).forEach(h=>{ hist[h.insumo] = h; }); }
  catch(e){ semBF = true; }
  if(!c.isConnected) return;
  if(semBF) c.insertBefore(el('div', 'vazio', 'Falta rodar a Parte BF no Supabase para salvar os preços.'), busca);
  const dataCurta = (t)=>{ const d = new Date(t); return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}); };
  const precoDe = (i)=> i.unidade === 'g' ? Number(i.custo_por_g) * 1000 : Number(i.custo_por_g);
  function desenharLista(){

    const q = normN(busca.value);
    const vis = ins.filter(i=>i.ativo !== false && (!q || normN(i.nome).indexOf(q) >= 0));

/* ---------- receitas (fichas tecnicas): ver, criar, editar, excluir ---------- */
async function fichasReceitas(corpo){
  let fichas = [], itens = [], ins = [];
  try{
    const f = 'loja_id=eq.' + LOJA;
    [fichas, itens, ins] = await Promise.all([
      api(`/rest/v1/est_fichas?select=id,nome,chave&${f}&order=nome.asc&limit=2000`),
      api(`/rest/v1/est_ficha_itens?select=ficha_id,insumo_id,qtd&${f}&limit=10000`),
      api(`/rest/v1/est_insumos?select=id,nome,unidade,custo_por_g,ativo&${f}&order=nome.asc&limit=2000`),
    ]);
  }catch(e){ corpo.appendChild(el('div', 'vazio', 'Não consegui ler as fichas. O Estoque já foi instalado no banco (Parte J)?')); return; }
  if(!corpo.isConnected) return;
  const insMap = {}; ins.forEach(i=>{ insMap[i.id] = i; });
  const itensDe = {}; itens.forEach(i=>{ (itensDe[i.ficha_id] = itensDe[i.ficha_id] || []).push({insumo:i.insumo_id, qtd:Number(i.qtd)}); });
  const custoItens = (lista)=> lista.reduce((s, i)=> s + (Number(i.qtd) || 0) * (insMap[i.insumo] ? Number(insMap[i.insumo].custo_por_g) : 0), 0);

  // preco de venda por nome (o mesmo casamento que o CMV do Cardapio usa)
  const precoPorChave = {}; const semFicha = [];
  const chaves = new Set(fichas.map(f=>normN(f.chave)));
  (D.produtos || []).filter(p=>p.ativo !== false).forEach(p=>{
    const tams = p.produto_tamanhos || [];
    tams.forEach(t=>{
      const cands = [normN('pizza ' + p.nome + ' ' + t.nome), normN(p.nome + ' ' + t.nome), normN(p.nome)];
      cands.forEach(k=>{ if(precoPorChave[k] === undefined) precoPorChave[k] = Number(t.preco); });
      if(!cands.some(k=>chaves.has(k))) semFicha.push({nome: tams.length === 1 ? nomeProd(p) : nomeProd(p) + ' ' + t.nome, preco: Number(t.preco)});
    });
  });

  function abrirEditor(ini){
    corpo.textContent = '';
    const ed = {id: ini.id || null, itens: (ini.itens || []).map(i=>({insumo:i.insumo, qtd:i.qtd}))};
    const voltar = el('button', 'btn cinza peq', '← Voltar às receitas'); voltar.onclick = ()=>desenhar(); corpo.appendChild(voltar);
    const card = el('div', 'cartao'); card.style.marginTop = '10px';
    card.appendChild(el('div', 'nome', ed.id ? 'Editar ficha' : 'Nova ficha'));
    const nome = el('input'); nome.value = ini.nome || ''; nome.style.width = '100%'; nome.placeholder = 'Ex.: Pizza Frango Grande';
    card.appendChild(campo('Nome da ficha', nome));
    card.appendChild(el('div', 'dica', 'O nome tem que ser igual ao do produto no Cardápio + o tamanho (ex.: "Pizza Frango Grande"). É assim que o sistema liga a ficha ao produto e calcula o CMV.'));
    if(!ed.id){
      const cp = el('select'); cp.style.cssText = estiloSelect;
      const o0 = el('option', '', '— começar do zero —'); o0.value = ''; cp.appendChild(o0);
      fichas.forEach(f=>{ const o = el('option', '', f.nome); o.value = f.id; cp.appendChild(o); });
      cp.onchange = ()=>{ ed.itens = (itensDe[cp.value] || []).map(i=>({insumo:i.insumo, qtd:i.qtd})); redesenhar(); };
      card.appendChild(campo('Começar copiando de uma ficha (opcional)', cp));
    }
    const linhas = el('div'); card.appendChild(linhas);
    const total = el('div', 'nome'); total.style.margin = '10px 0 2px';
    const cmvBox = el('div', 'dica');
    const spans = [];
    const unidadeDe = (id)=> (insMap[id] && insMap[id].unidade === 'un') ? 'un' : 'g';
    function atualizaTotal(){
      let t = 0;
      spans.forEach(([it, sp])=>{ const c1 = (Number(it.qtd) || 0) * (insMap[it.insumo] ? Number(insMap[it.insumo].custo_por_g) : 0); t += c1; sp.textContent = 'R$ ' + num2r(c1); });
      total.textContent = 'Custo da ficha: R$ ' + num2r(t);
      cmvBox.textContent = '';
      const pr = precoPorChave[normN(nome.value)];
      if(pr > 0 && t > 0){ cmvBox.appendChild(document.createTextNode('Preço de venda R$ ' + num2r(pr) + ' → ')); const s = seloCmv(t, pr); if(s) cmvBox.appendChild(s); }
      else if(nome.value.trim()) cmvBox.textContent = 'Ainda não achei um produto no Cardápio com esse nome, então não dá para mostrar o CMV.';
    }
    function redesenhar(){
      linhas.textContent = ''; spans.length = 0;
      ed.itens.forEach((it, idx)=>{
        const l = el('div', 'linha');
        const sel = el('select'); sel.style.cssText = estiloSelect;
        ins.filter(i=>i.ativo !== false || i.id === it.insumo).forEach(i=>{ const o = el('option', '', i.nome + (i.unidade === 'un' ? ' (un)' : ' (g)')); o.value = i.id; sel.appendChild(o); });
        sel.value = it.insumo;
        sel.onchange = ()=>{ it.insumo = sel.value; redesenhar(); };
        const q = inputNum(it.qtd === null || it.qtd === undefined ? '' : it.qtd); q.oninput = ()=>{ it.qtd = num(q.value); atualizaTotal(); };
        const un = el('span', 'dica', unidadeDe(it.insumo)); un.style.margin = '0';
        const sp = el('span', 'dica', ''); sp.style.margin = '0'; sp.style.minWidth = '70px'; spans.push([it, sp]);
        const x = el('button', 'btn cinza peq', '✕'); x.title = 'Tirar este ingrediente'; x.onclick = ()=>{ ed.itens.splice(idx, 1); redesenhar(); };
        l.appendChild(sel); l.appendChild(q); l.appendChild(un); l.appendChild(sp); l.appendChild(x);
        linhas.appendChild(l);
      });
      if(!ed.itens.length) linhas.appendChild(el('div', 'vazio', 'Nenhum ingrediente ainda. Clique em "+ Ingrediente".'));
      atualizaTotal();
    }
    nome.oninput = atualizaTotal;
    const add = el('button', 'btn cinza peq', '+ Ingrediente'); add.style.marginTop = '8px';
    add.onclick = ()=>{ const usados = new Set(ed.itens.map(i=>i.insumo)); const livre = ins.find(i=>i.ativo !== false && !usados.has(i.id)); if(!livre){ aviso('Não há mais insumos para adicionar.', 'erro'); return; } ed.itens.push({insumo:livre.id, qtd:null}); redesenhar(); };
    card.appendChild(add); card.appendChild(total); card.appendChild(cmvBox);
    redesenhar();
    const bl = el('div', 'linha');
    const salvar = el('button', 'btn verde', 'Salvar ficha');
    salvar.onclick = ()=>tentar(async()=>{
      const nm = nome.value.trim(); if(!nm) throw new Error('Digite o nome da ficha.');
      if(!ed.itens.length) throw new Error('Coloque pelo menos um ingrediente.');
      if(ed.itens.some(i=>!(Number(i.qtd) > 0))) throw new Error('Preencha a quantidade de todos os ingredientes.');
      const ids = ed.itens.map(i=>i.insumo); if(new Set(ids).size !== ids.length) throw new Error('Tem ingrediente repetido. Deixe cada um uma vez só.');
      await rpc('est_ficha_salvar', {p_loja:LOJA, p_id:ed.id || '', p_nome:nm, p_itens:ed.itens.map(i=>({insumo:i.insumo, qtd:Number(i.qtd)}))});
      await carregarCustos(); desenhar();
    }, 'Ficha salva. O CMV foi atualizado.');
    bl.appendChild(salvar);
    if(ed.id){
      const ex = el('button', 'btn vermelho', 'Excluir ficha');
      ex.onclick = ()=>{ if(!confirm('Excluir a ficha "' + (ini.nome || '') + '"? O produto fica sem CMV e sem baixa de estoque até ter outra ficha.')) return;
        tentar(async()=>{ await rpc('est_ficha_excluir', {p_loja:LOJA, p_id:ed.id}); await carregarCustos(); desenhar(); }, 'Ficha excluída.'); };
      bl.appendChild(ex);
    }
    card.appendChild(bl);
    corpo.appendChild(card);
    window.scrollTo(0, 0);
  }

  corpo.appendChild(el('p', 'dica', 'Receitas (fichas técnicas): quanto de cada ingrediente vai em cada produto. É daqui que sai o CMV e a baixa automática do estoque. Mude uma receita e o CMV do Cardápio se atualiza na hora.'));
  const nova = el('button', 'btn verde', '+ Nova ficha'); nova.onclick = ()=>abrirEditor({}); corpo.appendChild(nova);

  if(semFicha.length){
    const d = el('details', 'cartao'); d.open = true; d.style.marginTop = '10px';
    d.appendChild(el('summary', '', '⚠️ ' + semFicha.length + ' produto(s) do Cardápio sem ficha (sem CMV)'));
    semFicha.forEach(s=>{
      const l = el('div', 'linha'); l.appendChild(el('span', '', s.nome + ' · R$ ' + num2r(s.preco)));
      const b = el('button', 'btn cinza peq', 'Criar ficha'); b.onclick = ()=>abrirEditor({nome:s.nome});
      l.appendChild(b); d.appendChild(l);
    });
    corpo.appendChild(d);
  }

  const busca = el('input'); busca.placeholder = 'Buscar receita (ex.: calabresa)'; busca.style.cssText = 'width:100%;margin:10px 0';
  corpo.appendChild(busca);
  const lista = el('div'); corpo.appendChild(lista);
  function desenharLista(){
    lista.textContent = '';
    const q = normN(busca.value);
    const vis = fichas.filter(f=>!q || normN(f.nome).indexOf(q) >= 0);
    if(!vis.length){ lista.appendChild(el('div', 'vazio', 'Nenhuma receita encontrada.')); return; }
    vis.forEach(f=>{
      const li = itensDe[f.id] || []; const custo = custoItens(li);
      const card = el('div', 'cartao'); const l = el('div', 'linha'); l.style.marginTop = '0';
      const nm = el('div', 'nome', f.nome); nm.style.flex = '1'; l.appendChild(nm);
      l.appendChild(el('span', 'chip az', 'R$ ' + num2r(custo)));
      const pr = precoPorChave[normN(f.chave)]; const s = pr > 0 ? seloCmv(custo, pr) : null; if(s) l.appendChild(s);
      const b = el('button', 'btn cinza peq', 'Editar'); b.onclick = ()=>abrirEditor({id:f.id, nome:f.nome, itens:li});
      l.appendChild(b); card.appendChild(l);
      card.appendChild(el('div', 'dica', li.length + ' ingrediente(s)'));
      lista.appendChild(card);
    });
  }
  busca.oninput = desenharLista;
  desenharLista();
}

/* ---------- CMV das promocoes, combos e apps parceiros (Natal em Dobro, Prime) ---------- */
// CMV = so ingredientes (custo das fichas) / o que o cliente paga. Nao inclui embalagem, taxas nem comissao de app.
let promoCats = null;   // ids das categorias de pizza consideradas nas contas
async function fichasPromos(corpo){
  await carregarCustos();
  if(!corpo.isConnected) return;
  const cats = (D.categorias || []).filter(c=>c.tipo === 'pizza');
  if(promoCats === null) promoCats = new Set(cats.map(c=>c.id));
  const ehTam = (t, nome)=> normN(t.nome) === normN(nome);
  const pizzasDe = (tamNome)=>{
    const lista = [], sem = [];
    (D.produtos || []).filter(p=>p.ativo !== false && promoCats.has(p.categoria_id)).forEach(p=>{
      const t = (p.produto_tamanhos || []).find(x=>ehTam(x, tamNome)); if(!t) return;
      const custo = custoDe(p, t);
      if(custo === null) sem.push(nomeProd(p)); else lista.push({nome:nomeProd(p), custo, preco:Number(t.preco)});
    });
    return {lista, sem};
  };
  const chip = (rot, custo, paga)=>{ const s = seloCmv(custo, paga); if(!s) return null; s.textContent = rot + ' ' + s.textContent; return s; };
  const linhaCmv = (card, cenarios)=>{
    const l = el('div', 'linha');
    cenarios.forEach(([rot, custo, paga, dica])=>{ const s = chip(rot, custo, paga); if(s){ if(dica) s.title = dica + ' · ' + s.title; l.appendChild(s); } });
    card.appendChild(l);
  };

  corpo.appendChild(el('p', 'dica', 'CMV das promoções, combos e apps parceiros: custo dos ingredientes (pelas fichas) dividido pelo que o cliente paga. Não inclui embalagem, taxas nem comissão. Quando o cliente escolhe o sabor, mostro o melhor caso, o médio e o pior.'));

  // categorias de pizza consideradas
  if(cats.length > 1){
    const cx = el('div', 'cheios'); cx.appendChild(el('span', 'dica', 'Pizzas consideradas nas contas:'));
    cats.forEach(cat=>{ const m = marca(cat.nome, promoCats.has(cat.id)); m.input.onchange = ()=>{ if(m.input.checked) promoCats.add(cat.id); else promoCats.delete(cat.id); desenhar(); }; cx.appendChild(m); });
    corpo.appendChild(cx);
  }

  // ---- apps parceiros (so no PDV) ----
  corpo.appendChild(el('h3', '', 'Apps parceiros (valem só no PDV)'));
  function cartaoApp(titulo, explica, tam){
    const card = el('div', 'cartao'); card.appendChild(el('div', 'nome', titulo)); card.appendChild(el('div', 'dica', explica));
    const {lista, sem} = pizzasDe(tam);
    if(lista.length < 1){ card.appendChild(el('div', 'vazio', 'Nenhuma pizza ' + tam.toLowerCase() + ' com ficha.')); return card; }
    let soma = 0, pagaSoma = 0, n = 0, pior = null, melhor = null;
    for(let i = 0; i < lista.length; i++) for(let j = i; j < lista.length; j++){
      const c = lista[i].custo + lista[j].custo, p = Math.max(lista[i].preco, lista[j].preco);
      soma += c; pagaSoma += p; n++;
      const r = c / p;
      if(!pior || r > pior.r) pior = {r, c, p, a:lista[i].nome, b:lista[j].nome};
      if(!melhor || r < melhor.r) melhor = {r, c, p, a:lista[i].nome, b:lista[j].nome};
    }
    linhaCmv(card, [['Melhor', melhor.c, melhor.p, melhor.a + ' + ' + melhor.b], ['Médio', soma / n, pagaSoma / n, 'todas as combinações possíveis'], ['Pior', pior.c, pior.p, pior.a + ' + ' + pior.b]]);
    card.appendChild(el('div', 'dica', 'Pior caso: ' + pior.a + ' + ' + pior.b + ' → custo R$ ' + num2r(pior.c) + ' e o cliente paga R$ ' + num2r(pior.p) + '. Melhor: ' + melhor.a + ' + ' + melhor.b + ' (R$ ' + num2r(melhor.c) + ' de R$ ' + num2r(melhor.p) + ').'));
    if(sem.length) card.appendChild(el('div', 'dica', '⚠️ Sem ficha (fora da conta): ' + sem.join(', ')));
    return card;
  }
  corpo.appendChild(cartaoApp('Natal em Dobro', '2 pizzas pequenas e o cliente paga a de maior valor.', 'Pequena'));
  corpo.appendChild(cartaoApp('Prime (no salão)', '2 pizzas grandes e o cliente paga a de maior valor.', 'Grande'));
  (function(){
    const card = el('div', 'cartao'); card.appendChild(el('div', 'nome', 'Prime (entrega, 30% de desconto)')); card.appendChild(el('div', 'dica', 'Pizza fora de promoção com 30% de desconto. Vale para grande e pequena.'));
    ['Grande', 'Pequena'].forEach(tam=>{
      const {lista, sem} = pizzasDe(tam); if(!lista.length) return;
      let c = 0, p = 0, pior = null, melhor = null;
      lista.forEach(x=>{ c += x.custo; p += x.preco * 0.7; const r = x.custo / (x.preco * 0.7); if(!pior || r > pior.r) pior = {r, x}; if(!melhor || r < melhor.r) melhor = {r, x}; });
      card.appendChild(el('div', 'dica', tam + ':'));
      linhaCmv(card, [['Melhor', melhor.x.custo, melhor.x.preco * 0.7, melhor.x.nome], ['Médio', c / lista.length, p / lista.length, 'média das pizzas'], ['Pior', pior.x.custo, pior.x.preco * 0.7, pior.x.nome]]);
      card.appendChild(el('div', 'dica', 'Pior: ' + pior.x.nome + ' (custo R$ ' + num2r(pior.x.custo) + ' de R$ ' + num2r(pior.x.preco * 0.7) + ').' + (sem.length ? ' ⚠️ Sem ficha: ' + sem.join(', ') : '')));
    });
    corpo.appendChild(card);
  })();

  // ---- promocoes e combos cadastrados na aba Promocoes ----
  corpo.appendChild(el('h3', '', 'Promoções e combos do site'));
  if(!(D.promocoes || []).length) corpo.appendChild(el('div', 'vazio', 'Nenhuma promoção cadastrada.'));
  (D.promocoes || []).forEach(pm=>{
    const card = el('div', 'cartao'); const topo = el('div', 'topo');
    topo.appendChild(el('span', 'nome', pm.nome)); topo.appendChild(el('span', 'chip ' + (pm.ativa ? 'az' : 'nao'), pm.ativa ? 'Ativa' : 'Pausada')); card.appendChild(topo);
    let tMelhor = 0, tMedio = 0, tPior = 0, pMelhor = 0, pMedio = 0, pPior = 0, ok = true; const avisos = []; let pagoCheio = 0;
    (pm.promocao_etapas || []).forEach(et=>{
      if(et.tipo !== 'pizza'){ avisos.push('Etapa "' + et.titulo + '" (' + et.tipo + ') não entra na conta.'); return; }
      const d = Number(et.desconto_pct) || 0; let ops = [];
      const prods = et.qualquer_pizza ? (D.produtos || []).filter(p=>p.ativo !== false && promoCats.has(p.categoria_id)) : (et.promocao_opcoes || []).map(o=>(D.produtos || []).find(x=>x.id === o.produto_id)).filter(Boolean);
      prods.forEach(p=>{
        const t = (p.produto_tamanhos || []).find(x=>ehTam(x, et.tamanho || ''));
        if(!t) return; const c = custoDe(p, t);
        if(c === null){ avisos.push('Sem ficha: ' + nomeProd(p) + ' ' + t.nome); return; }
        ops.push({c, paga:Number(t.preco) * (1 - d / 100), nome:nomeProd(p)});
      });
      if(!ops.length){ ok = false; avisos.push('Etapa "' + et.titulo + '": nenhuma opção com ficha.'); return; }
      ops.sort((a, b)=>a.c - b.c);
      const med = (k)=> ops.reduce((s, o)=>s + o[k], 0) / ops.length;
      tMelhor += ops[0].c; pMelhor += ops[0].paga; tPior += ops[ops.length - 1].c; pPior += ops[ops.length - 1].paga; tMedio += med('c'); pMedio += med('paga');
    });
    if(ok && pMedio > 0){
      linhaCmv(card, [['Melhor', tMelhor, pMelhor, 'sabores mais baratos'], ['Médio', tMedio, pMedio, 'média dos sabores'], ['Pior', tPior, pPior, 'sabores mais caros']]);
      card.appendChild(el('div', 'dica', 'Cliente paga cerca de R$ ' + num2r(pMedio) + ' · custo médio R$ ' + num2r(tMedio) + '.'));
    }else if(ok) card.appendChild(el('div', 'dica', 'Sem preço a calcular (promoção gratuita ou sem etapas de pizza).'));
    [...new Set(avisos)].slice(0, 6).forEach(a=>card.appendChild(el('div', 'dica', '⚠️ ' + a)));
    corpo.appendChild(card);
  });
  corpo.appendChild(el('p', 'dica', 'Combos que são produto do Cardápio (ex.: Combo Casal) aparecem com CMV no próprio Cardápio, quando têm ficha.'));
}

/* ---------- CMV REAL: o que foi vendido de verdade (fichas x pedidos concluidos) ---------- */
// Custo = ficha tecnica de cada item vendido (+ borda). Receita = o que o cliente pagou, sem o frete.
// Pedido com item sem ficha fica de fora da conta (e aparece na lista), para nao baratear o CMV.
function calcCmvReal(peds, custoMap, norm){
  const achar = (nome, tam)=>{ for(const k of [norm('pizza ' + nome + ' ' + tam), norm(nome + ' ' + tam), norm(nome)]){ if(custoMap[k] !== undefined) return custoMap[k]; } return null; };
  const R = {geral:{pedidos:0, receita:0, bruto:0, custo:0}, promo:{}, mod:{}, itens:{}, semFicha:{}, excluidos:0, total:0};
  const soma = (o, k, v)=>{ (o[k] = o[k] || {pedidos:0, receita:0, bruto:0, custo:0}); o[k].pedidos += v.pedidos; o[k].receita += v.receita; o[k].bruto += v.bruto; o[k].custo += v.custo; };
  (peds || []).forEach(p=>{
    R.total++;
    let custo = 0, bruto = 0, ok = true; const promos = new Set(), linhas = [];
    (Array.isArray(p.itens) ? p.itens : []).forEach(it=>{
      const nome = String(it.nome || '').trim(); if(!nome) return;
      const qtd = Math.max(1, Number(it.qtd) || 1); const preco = Number(it.precoUnit) || 0;
      const bruta = String(it.tamanho || ''); let tam = bruta, borda = null;
      if(tam.indexOf(' • Borda: ') >= 0){ borda = tam.split(' • Borda: ')[1].split(' — ')[0].replace(/\(gr[aá]tis\)/i, '').trim(); tam = tam.split(' • Borda: ')[0]; }
      if(bruta.indexOf(' — ') >= 0) promos.add(bruta.split(' — ').slice(1).join(' — ').split(' • ')[0].trim());
      tam = tam.split(' — ')[0].trim();
      let c = null;
      if(nome.slice(0, 13) === 'Meio a Meio: '){
        const sab = nome.slice(13).split(' / '); const cs = sab.map(s=>achar(s.trim(), tam));
        if(cs.every(x=>x !== null)) c = cs.reduce((a, b)=>a + b, 0) / cs.length; else sab.forEach((s, i)=>{ if(cs[i] === null) R.semFicha[s.trim() + ' ' + tam] = (R.semFicha[s.trim() + ' ' + tam] || 0) + 1; });
      }else{
        c = achar(nome, tam); if(c === null) R.semFicha[nome + ' ' + tam] = (R.semFicha[nome + ' ' + tam] || 0) + 1;
      }
      if(c === null){ ok = false; return; }
      let cb = 0;
      if(borda && norm(borda) !== 'sem borda'){
        const v = custoMap[norm('borda ' + borda)];
        if(v === undefined){ R.semFicha['Borda ' + borda] = (R.semFicha['Borda ' + borda] || 0) + 1; ok = false; return; }
        cb = v;
      }
      const cItem = (c + cb) * qtd, rItem = preco * qtd;
      custo += cItem; bruto += rItem; linhas.push({chave:nome + ' | ' + tam, nome, tam, qtd, custo:cItem, receita:rItem});
    });
    if(!ok){ R.excluidos++; return; }
    const receita = Math.max(0, (Number(p.total) || 0) - (Number(p.taxa_entrega) || 0));
    const v = {pedidos:1, receita, bruto, custo};
    soma(R, 'geral', v);
    promos.forEach(n=>soma(R.promo, n, v));
    soma(R.mod, p.modalidade || 'Nao informado', v);
    linhas.forEach(l=>{ const a = (R.itens[l.chave] = R.itens[l.chave] || {nome:l.nome, tam:l.tam, qtd:0, custo:0, receita:0}); a.qtd += l.qtd; a.custo += l.custo; a.receita += l.receita; });
  });
  return R;
}

/* ---------- CMV de um mes do Suitable (arquivos exportados: Produtos vendidos + Complementos vendidos) ---------- */
// Os .xls do Suitable sao tabelas HTML. O sabor da pizza vem nos "Complementos" (ex.: "Calabresa G"); o "Produtos vendidos" traz so "Pizza Grande Grande".
// Estimativa: custo medio do sabor (pelas nossas fichas) x numero de pizzas. Meio a meio entra como dois sabores, entao ajusto pelo numero real de pizzas.
function lerTabelaSuitable(txt){
  const dec = (s)=>String(s).replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;|&apos;/g, "'").replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
  const linhas = [];
  String(txt).split(/<tr[\s>]/i).slice(1).forEach(tr=>{
    const cel = []; tr.replace(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi, (m, c)=>{ cel.push(dec(c)); return m; });
    if(cel.length) linhas.push(cel);
  });
  return linhas;
}
const dinSuit = (s)=>{ const t = String(s || '').replace(/R\$/g, '').trim(); if(!t) return 0; const n = parseFloat(t.replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
function calcSuitable(txtProd, txtComp, custoMap, norm){
  // O Suitable tem mais de um modelo de "Produtos vendidos": acha as colunas pelo nome do cabecalho
  const TP = lerTabelaSuitable(txtProd), cab = (TP[0] || []).map(x=>String(x).toLowerCase());
  const ix = (re, pad)=>{ const i = cab.findIndex(x=>re.test(x)); return i >= 0 ? i : pad; };
  const iProd = ix(/^produto/, 0), iCat = ix(/categoria/, -1), iVt = ix(/valor total/, 4), iQtd = ix(/^quantidade|^qtd/, 5);
  const P = TP.slice(1).map(c=>({prod:c[iProd] || '', cat:iCat >= 0 ? (c[iCat] || '') : '', vt:dinSuit(c[iVt]), qtd:Number(String(c[iQtd] || '0').replace(/\./g, '')) || 0}));
  const C = lerTabelaSuitable(txtComp).slice(1).map(c=>({desc:c[0] || '', qtd:Number(String(c[2] || '0').replace(/\./g, '')) || 0}));
  const R = {pizzas:{Grande:0, Pequena:0}, receita:0, itensPizza:0, sabores:{Grande:[], Pequena:[]}, bordas:[], semFicha:[], custoPizzas:0, custoBordas:0, ifood:0, cobertura:{}};
  // pizzas proprias (sem iFood): conta unidades por tamanho e a receita (ja com adicionais)
  P.forEach(r=>{
    if(/ifood/i.test(r.cat)){ R.ifood += r.vt; return; }
    if(/^pizza\s/i.test(r.prod) || /^combo/i.test(r.prod) && false){
      R.receita += r.vt;
      if(/grande/i.test(r.prod)) R.pizzas.Grande += r.qtd; else if(/pequena/i.test(r.prod)) R.pizzas.Pequena += r.qtd;
    }
  });
  const tentar = (nome, tam)=>{
    const base = nome.replace(/catupity/ig, 'catupiry').replace(/\.$/, '').trim();
    const vars = new Set([base, base.replace(/\bc\//ig, 'com '), base.replace(/\bc\//ig, 'c '), base.replace(/\s*c\/\s*/ig, ' com '), base.replace(/\bcom\b/ig, 'c')]);
    for(const v of vars){ for(const k of [norm('pizza ' + v + ' ' + tam), norm(v + ' ' + tam), norm('pizza ' + v)]){ if(custoMap[k] !== undefined) return custoMap[k]; } }
    return null;
  };
  const acha = (nome, tam)=> tentar(nome, tam);
  const somaB = {};
  C.forEach(c=>{
    const d = c.desc.trim(); if(!d || c.qtd <= 0) return;
    // bordas
    let b = null;
    if(/^massa tradicional \+ borda tradicional$/i.test(d)) return;
    let m = d.match(/^massa tradicional \+ borda (.+)$/i); if(m) b = m[1];
    else if((m = d.match(/^borda (?:de )?(.+)$/i))) b = m[1];
    else if(/^(chocolate|catupiry)$/i.test(d)) b = d;
    if(b){ const k = norm('borda ' + b); const v = custoMap[k]; if(v === undefined) R.semFicha.push({nome:'Borda ' + b, qtd:c.qtd}); else { R.custoBordas += v * c.qtd; somaB[b.toLowerCase()] = (somaB[b.toLowerCase()] || 0) + c.qtd; } return; }
    if(/^1\//.test(d)) return;                                   // meio a meio do iFood: fora (iFood fica separado)
    let tam = null, nome = d;
    if(/ G$/.test(d)){ tam = 'Grande'; nome = d.slice(0, -2); } else if(/ P$/.test(d)){ tam = 'Pequena'; nome = d.slice(0, -2); } else if(/ pequena$/i.test(d)){ tam = 'Pequena'; nome = d.replace(/ pequena$/i, ''); }
    if(!tam) return;                                              // linhas sem tamanho sao do iFood/bebida: fora
    if(/guaran|coca|pepsi|suco/i.test(nome)) return;
    const custo = acha(nome.trim(), tam);
    if(custo === null){ R.semFicha.push({nome:nome.trim() + ' ' + tam, qtd:c.qtd}); return; }
    R.sabores[tam].push({nome:nome.trim(), qtd:c.qtd, custo});
  });
  ['Grande', 'Pequena'].forEach(t=>{
    const L = R.sabores[t], q = L.reduce((a, x)=>a + x.qtd, 0), cs = L.reduce((a, x)=>a + x.qtd * x.custo, 0);
    const semQ = R.semFicha.filter(x=>/ (Grande|Pequena)$/.test(x.nome) && x.nome.endsWith(t)).reduce((a, x)=>a + x.qtd, 0);
    R.cobertura[t] = (q + semQ) > 0 ? q / (q + semQ) : 0;
    const medio = q > 0 ? cs / q : 0;                             // custo medio por "sabor" (sem ajustar)
    R['medio' + t] = medio; R['saboresQtd' + t] = q;
    R.custoPizzas += medio * R.pizzas[t];                         // ajusta pelo numero de pizzas de verdade
  });
  R.custo = R.custoPizzas + R.custoBordas;
  return R;
}

    out.appendChild(sd);
    const cg = Math.round(R.cobertura.Grande * 100), cp = Math.round(R.cobertura.Pequena * 100);
    out.appendChild(el('p', 'dica', 'Sabores com ficha: ' + cg + '% das grandes e ' + cp + '% das pequenas. Quanto mais fichas, mais exata a conta. iFood, bebidas e sobremesas ficaram de fora' + (R.ifood > 0 ? ' (iFood: ' + money(R.ifood) + ')' : '') + '.'));
    const rk = []; ['Grande', 'Pequena'].forEach(t=>R.sabores[t].forEach(x=>rk.push({t, nome:x.nome, qtd:x.qtd, custo:x.custo, tot:x.qtd * x.custo})));
    const tot = rk.reduce((a, x)=>a + x.tot, 0) || 1;
    rk.sort((a, b)=>b.tot - a.tot);
    out.appendChild(el('h3', '', 'Quem mais pesa no custo (sabor × quantidade)'));
    out.appendChild(tabelaSimples(['Sabor', 'Tam.', 'Vezes', 'Custo da ficha', '% do custo'], rk.slice(0, 15).map(x=>[x.nome, x.t === 'Grande' ? 'G' : 'P', x.qtd, money(x.custo), (x.tot / tot * 100).toFixed(0) + '%'])));
    const sf = R.semFicha.sort((a, b)=>b.qtd - a.qtd).slice(0, 25).map(x=>[x.nome, x.qtd]);
    if(sf.length){ out.appendChild(el('h3', '', 'Sem ficha ou nome diferente (fora da conta)')); out.appendChild(el('p', 'dica', 'Se o sabor existe, o nome da ficha precisa ficar igual ao do cardápio + tamanho. Me mande esta lista que eu acerto.')); out.appendChild(tabelaSimples(['Sabor', 'Vezes'], sf)); }

const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function periodoDoPreset(p){
  const hoje = agoraLocal().data;
  if(p === 'hoje') return {ini:hoje, fim:hoje};
  if(p === '7') return {ini:somaDias(hoje, -6), fim:hoje};
  if(p === '30') return {ini:somaDias(hoje, -29), fim:hoje};
  if(p === 'mes') return {ini:hoje.slice(0, 8) + '01', fim:hoje};
  const ini = hoje.slice(0, 8) + '01', fimAnt = somaDias(ini, -1);           // mes passado
  return {ini:fimAnt.slice(0, 8) + '01', fim:fimAnt};
}
let relPeriodo = {preset:'mes', ...periodoDoPreset('mes')}, relDados = null;
const brData = (iso) => String(iso).slice(8, 10) + '/' + String(iso).slice(5, 7);
const brDataHora = (iso) => new Date(iso).toLocaleString('pt-BR', {timeZone:'America/Fortaleza', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});

function csvRelatorio(qual, d){
  const lin = (cab, linhas) => '\ufeff' + cab.join(',') + '\n' + linhas.map(l=>l.map(csvCampo).join(',')).join('\n') + (linhas.length ? '\n' : '');
  const num2 = (v) => Number(v || 0).toFixed(2).replace('.', ',');
  if(qual === 'resumo'){
    const L = [['Faturamento', num2(d.resumo.faturamento)], ['Pedidos', d.resumo.pedidos], ['Ticket medio', num2(d.resumo.ticket_medio)], ['Cancelados', d.resumo.cancelados], ['Taxas de entrega', num2(d.resumo.taxas_entrega)]];
    d.resumo.por_modalidade.forEach(x=>L.push(['Modalidade: ' + x.nome, num2(x.faturamento) + ' (' + x.pedidos + ' pedidos)']));
    agruparPagamentos(d.resumo.por_pagamento).forEach(x=>L.push(['Pagamento: ' + x.nome, num2(x.faturamento) + ' (' + x.pedidos + ' pedidos)']));
    d.resumo.por_dia.forEach(x=>L.push(['Dia ' + x.dia, num2(x.faturamento) + ' (' + x.pedidos + ' pedidos)']));
    return lin(['Item', 'Valor'], L);
  }
  if(qual === 'produtos') return lin(['Produto', 'Tamanho', 'Quantidade', 'Valor'], d.produtos.produtos.map(x=>[x.nome, x.tamanho, x.quantidade, num2(x.valor)]));
  if(qual === 'cancelados') return lin(['Pedido', 'Quando', 'Cliente', 'Modalidade', 'Total', 'Motivo'], d.cancelados.map(x=>[x.numero, brDataHora(x.quando), x.cliente, x.modalidade, num2(x.total), x.motivo || '']));
  if(qual === 'bairros') return lin(['Bairro', 'Pedidos', 'Faturamento', 'Ticket medio', 'Taxas'], d.bairros.map(x=>[x.bairro, x.pedidos, num2(x.faturamento), num2(x.ticket_medio), num2(x.taxas)]));
  return lin(['Origem', 'Pedidos', 'Faturamento', 'Ticket medio'], d.origem.map(x=>[x.origem, x.pedidos, num2(x.faturamento), num2(x.ticket_medio)]));
}

/* ---------- Chamar de volta (WhatsApp): modelo aprovado volta_cliente_sumido ---------- */
const CAMPANHA_VOLTA = {id:'volta-combo-dupla', custoMsg:0.32, codigo:'DUPLA59'};   // mesma campanha toda semana: cada pessoa recebe uma vez; a cada semana você chama gente nova
function ofertaVolta(){   // a promoção vale de terça a sexta: a mensagem leva a data da próxima sexta
  const d = new Date(); while(d.getDay() !== 5) d.setDate(d.getDate() + 1);
  const dd = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
  return '2 pizzas pequenas por R$ 59,90 com o código ' + CAMPANHA_VOLTA.codigo + ', de terça a sexta, até ' + dd;
}
async function chamarDeVolta(seg, rotulo){
  // trava de seguranca: o codigo que vai na mensagem precisa existir, estar ligado e valer ate sexta
  try{
    const cs = await rpc('cupom_lista', {p_loja:LOJA});
    const cp = (cs || []).find(x=>x.codigo === CAMPANHA_VOLTA.codigo);
    if(!cp || !cp.ativo || cp.tipo !== 'libera'){ aviso('Antes de enviar: crie/ligue o cupom ' + CAMPANHA_VOLTA.codigo + ' na aba Cupons (tipo "Libera uma promoção" → Combo Dupla). Sem ele o cliente não consegue pedir.', 'erro'); return; }
    const d = new Date(); while(d.getDay() !== 5) d.setDate(d.getDate() + 1);
    const sexta = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if(cp.valida_ate && String(cp.valida_ate).slice(0, 10) < sexta){ aviso('O cupom ' + CAMPANHA_VOLTA.codigo + ' vence antes de sexta (' + dataCupom(cp.valida_ate) + '). Renove a validade na aba Cupons antes de enviar.', 'erro'); return; }
  }catch(e){ aviso(erroRelNovo(e, 'BD e BE', 'a conferência do cupom da campanha'), 'erro'); return; }
  let pv;
  try{ pv = await rpc('campanha_previa', {p_loja:LOJA, p_segmento:seg, p_campanha:CAMPANHA_VOLTA.id}); }
  catch(e){ aviso(erroRelNovo(e, 'AY', 'o envio da campanha'), 'erro'); return; }
  if(!Number(pv.disponiveis)){ aviso('Neste grupo não há mais ninguém para receber esta campanha (todos já receberam ou responderam SAIR).', 'erro'); return; }
  const max = Math.min(50, Number(pv.disponiveis));
  const sug = Math.min(20, max);
  const r = prompt('Grupo: ' + rotulo + '\nNo grupo: ' + pv.no_grupo + ' pessoas · já receberam esta campanha: ' + pv.ja_receberam + ' · faltam: ' + pv.disponiveis + '\n\nPara quantas pessoas enviar AGORA? (de 1 a ' + max + '). Sugestão: ' + sug + ' para começar.', String(sug));
  if(r === null) return;
  const qtd = parseInt(String(r).replace(/\D/g, ''), 10);
  if(!qtd || qtd < 1 || qtd > max){ aviso('Número inválido. Digite de 1 a ' + max + '.', 'erro'); return; }
  const oferta = ofertaVolta();
  const hoje = new Date().getDay(), foraDoDia = (hoje === 0 || hoje === 1 || hoje === 6);
  const custo = (qtd * CAMPANHA_VOLTA.custoMsg).toFixed(2).replace('.', ',');
  if(!confirm('Vai enviar para ' + qtd + ' pessoas do grupo "' + rotulo + '".\n\nMensagem: "Oi, [nome], quanto tempo! ... condição especial para você voltar: ' + oferta + ' ..."' + (foraDoDia ? '\n\nATENÇÃO: hoje não é dia da promoção (ela vale de terça a sexta). O ideal é enviar de terça a sexta.' : '') + '\n\nCusto aproximado: R$ ' + custo + ' (a Meta cobra cerca de R$ ' + String(CAMPANHA_VOLTA.custoMsg).replace('.', ',') + ' por mensagem entregue).\nQuem respondeu SAIR e quem já recebeu não entra.\n\nConfirmar o envio?')) return;
  aviso('Enviando... não feche esta tela.', 'ok');
  try{
    if(sessao && sessao.expira - Date.now() < 120000) await renovar();
    const resp = await fetch(SUPABASE_URL + '/functions/v1/whatsapp-campanha', {
      method:'POST', headers:{apikey:SUPABASE_KEY, 'Content-Type':'application/json', Authorization:'Bearer ' + (sessao ? sessao.access_token : '')},
      body:JSON.stringify({segmento:seg, campanha:CAMPANHA_VOLTA.id, oferta:oferta, limite:qtd, confirmar:true}),
    });
    let j = null; try{ j = await resp.json(); }catch(e){}
    if(!resp.ok || !j || !j.ok) throw new Error((j && j.erro) || ('erro ' + resp.status));
    let msg = 'Pronto: ' + j.enviados + ' enviada(s)' + (j.erros ? ' e ' + j.erros + ' com erro' : '') + '. ';
    if(j.erros && j.exemplos_de_erro && j.exemplos_de_erro.length) msg += 'Motivo: ' + j.exemplos_de_erro[0];
    aviso(msg, j.erros ? 'erro' : 'ok');
    desenhar();
  }catch(e){ aviso('Não consegui enviar: ' + String(e.message || e), 'erro'); }
}

function slugUtm(t){ return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60); }
function qrParaCanvas(texto){
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  const n = q.getModuleCount(), cel = 10, borda = 4, tam = (n + borda * 2) * cel;
  const cv = document.createElement('canvas'); cv.width = tam; cv.height = tam;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, tam, tam); g.fillStyle = '#000';
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) g.fillRect((c + borda) * cel, (r + borda) * cel, cel, cel);
  return cv;
}

/* ============================ PIX PELO QR CODE ============================ */
function pixSemAcento(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function pixCampo(id, valor){ return id + String(valor.length).padStart(2,'0') + valor; }
function pixCrc16(texto){
  let crc = 0xFFFF;
  for(let i=0;i<texto.length;i++){ crc ^= texto.charCodeAt(i) << 8; for(let b=0;b<8;b++){ crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; } }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function pixPayload({chave, recebedor, cidade, valor}){          // igual ao do site
  const conta = pixCampo('00','br.gov.bcb.pix') + pixCampo('01', chave);
  let p = pixCampo('00','01') + pixCampo('01','11') + pixCampo('26', conta) + pixCampo('52','0000') + pixCampo('53','986');
  if(valor > 0) p += pixCampo('54', Number(valor).toFixed(2));
  p += pixCampo('58','BR') + pixCampo('59', pixSemAcento(recebedor).toUpperCase().slice(0,25) || 'GRAN PAOLO')
     + pixCampo('60', pixSemAcento(cidade).toUpperCase().slice(0,15) || 'NATAL') + pixCampo('62', pixCampo('05','***'));
  p += '6304';
  return p + pixCrc16(p);
}

];
let botDados = null;
async function buscarTodos(caminho){
  const todos = [];
  for(let ini = 0; ini < 20000; ini += 1000){
    const pag = await api(caminho + '&limit=1000&offset=' + ini);
    todos.push(...pag); if(pag.length < 1000) break;
  }
  return todos;
}
const hora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', {timeZone:'America/Fortaleza', hour:'2-digit', minute:'2-digit'});

async function carregarBot(){
  const f = 'loja_id=eq.' + LOJA;
  try{
    const [cfg, textos, conv] = await Promise.all([
      api(`/rest/v1/bot_config?${f}`), api(`/rest/v1/bot_textos?${f}`),
      api(`/rest/v1/bot_conversas?${f}&precisa_humano=eq.true&order=ultima_entrada_em.desc`),
    ]);
    let msgs = [];
    if(conv.length){ msgs = await api(`/rest/v1/bot_mensagens?${f}&telefone=in.(${conv.map(c=>c.telefone).join(',')})&order=criado_em.desc&limit=60`); }
    const ini = agoraLocal().data + 'T00:00:00-03:00';
    const hoje = await api(`/rest/v1/bot_fila?select=status&${f}&criado_em=gte.${encodeURIComponent(ini)}`);
    const entradas = await api(`/rest/v1/bot_mensagens?select=id&${f}&sentido=eq.entrada&criado_em=gte.${encodeURIComponent(ini)}`);
    const contatos = await buscarTodos(`/rest/v1/bot_contatos_v?${f}&order=ultimo_contato_em.desc,telefone.asc`);   // o telefone desempata: sem isso, contatos com o mesmo horario podem sumir entre as paginas
    botDados = {instalado:true, cfg:cfg[0] || null, textos, conv, msgs, hoje, entradas:entradas.length, contatos};
  }catch(e){
    botDados = {instalado:false, erro:String(e.message || e)};
  }
}

const rascunhos = {};          // o que a equipe ja digitou em cada conversa (a tela se atualiza sozinha, e nao pode apagar o texto)
const ROTULO_SAIDA = {humano_painel:'Equipe'};
async function responderCliente(telefone, texto){
  if(sessao && sessao.expira - Date.now() < 120000) await renovar();
  const r = await fetch(SUPABASE_URL + '/functions/v1/whatsapp-robo?acao=responder', {
    method:'POST', headers:{apikey:SUPABASE_KEY, 'Content-Type':'application/json', Authorization:'Bearer ' + (sessao ? sessao.access_token : '')},
    body:JSON.stringify({telefone, texto}),
  });
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok || !j || !j.ok) throw new Error((j && j.erro) || ('erro ' + r.status));
}
/* foto / audio / video / arquivo que o cliente mandou (fica num cofre privado; o link abre por 1 hora) */
async function mostrarMidia(box, m){
  try{
    const r = await api('/storage/v1/object/sign/midias-whatsapp/' + m.midia_path, {method:'POST', body:JSON.stringify({expiresIn:3600})});
    const url = SUPABASE_URL + '/storage/v1' + r.signedURL;
    if(m.midia_tipo === 'image'){
      const a = el('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
      const im = el('img'); im.src = url; im.alt = 'Foto do cliente'; im.style.cssText = 'max-width:220px;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;';
      a.appendChild(im); box.appendChild(a);
    } else if(m.midia_tipo === 'audio'){
      const au = el('audio'); au.controls = true; au.src = url; au.style.cssText = 'width:100%;max-width:320px;'; box.appendChild(au);
    } else if(m.midia_tipo === 'video'){
      const v = el('video'); v.controls = true; v.src = url; v.style.cssText = 'max-width:100%;width:260px;border-radius:10px;'; box.appendChild(v);
    } else {
      const a = el('a', '', 'Abrir arquivo enviado pelo cliente'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a);
    }
    if(m.midia_legenda){ const lg = el('div', 'dica', 'Legenda: ' + m.midia_legenda); lg.style.color = 'var(--ink)'; box.appendChild(lg); }
  }catch(e){ box.appendChild(el('div', 'dica', 'Não consegui abrir o arquivo agora (' + String(e.message || e).slice(0, 80) + ').')); }
}
function desenharAtend(box){
  box.innerHTML = '';
  const conv = botDados.conv;
  box.appendChild(el('h2', '', 'Precisam de atendimento (' + conv.length + ')'));
  if(!conv.length){ box.appendChild(el('div', 'vazio', 'Ninguém esperando. Quando um cliente pedir atendente ou usar a ajuda do site, aparece aqui e no painel de pedidos.')); return; }
  box.appendChild(el('p', 'dica', 'Escreva a resposta aqui e toque em "Enviar": ela chega no WhatsApp do cliente pelo número do robô. Quando terminar, toque em "Marcar como atendido" para o robô voltar a responder. Até lá ele fica quieto com esse cliente. O WhatsApp só deixa responder até 24 horas depois da última mensagem do cliente.'));
  conv.forEach(cv=>{
    const card = el('div', 'cartao'); const topo = el('div', 'topo');
    topo.appendChild(el('span', 'nome', cv.nome || cv.telefone)); topo.appendChild(el('span', 'chip am', cv.motivo || 'atendimento'));
    card.appendChild(topo);
    card.appendChild(el('div', 'dica', cv.telefone + ' · último contato ' + hora(cv.ultima_entrada_em)));
    botDados.msgs.filter(m=>m.telefone === cv.telefone).slice(0, 6).reverse().forEach(m=>{
      const quem = m.sentido === 'entrada' ? 'Cliente' : (ROTULO_SAIDA[m.acao] || 'Robô');
      const l = el('div', 'dica', hora(m.criado_em) + ' · ' + quem + ': ' + String(m.texto || '').replace(/\s+/g, ' ').slice(0, 220)); l.style.color = 'var(--ink)'; card.appendChild(l);
      if(m.midia_path){ const mb = el('div', ''); mb.style.cssText = 'margin:2px 0 8px;'; card.appendChild(mb); mostrarMidia(mb, m); }
    });
    const aberta = !!cv.ultima_entrada_em && (Date.now() - new Date(cv.ultima_entrada_em).getTime()) < 24 * 3600 * 1000;
    const ta = el('textarea'); ta.placeholder = aberta ? 'Escreva a resposta para o cliente...' : 'Passaram mais de 24 horas: só dá para responder quando o cliente escrever de novo.';
    ta.maxLength = 1500; ta.disabled = !aberta; ta.style.cssText = 'width:100%;min-height:70px;margin-top:8px;padding:9px;border:1.5px solid var(--line);border-radius:9px;font:inherit';
    ta.value = rascunhos[cv.telefone] || ''; ta.oninput = ()=>{ rascunhos[cv.telefone] = ta.value; };
    card.appendChild(ta);
    const lin = el('div', 'linha');
    const env = el('button', 'btn verde peq', 'Enviar'); env.disabled = !aberta;
    env.onclick = ()=>{
      const t = ta.value.trim(); if(!t){ aviso('Escreva a mensagem primeiro.', 'erro'); return; }
      env.disabled = true; env.textContent = 'Enviando...';
      tentar(async()=>{ await responderCliente(cv.telefone, t); rascunhos[cv.telefone] = ''; await carregarBot(); desenhar(); }, 'Mensagem enviada').then(r=>{ if(r === undefined){ env.disabled = false; env.textContent = 'Enviar'; } });
    };
    lin.appendChild(env);
    const ok = el('button', 'btn cinza peq', 'Marcar como atendido');
    ok.onclick = ()=>tentar(async()=>{ await rpc('bot_marcar_atendido', {p_loja:LOJA, p_telefone:cv.telefone}); delete rascunhos[cv.telefone]; await carregarBot(); desenhar(); }, 'Marcado como atendido');
    lin.appendChild(ok); card.appendChild(lin); box.appendChild(card);
  });
}

/* ---------- lista de contatos: planilhas ---------- */
const csvCampo = (v) => { const t = String(v === null || v === undefined ? '' : v); return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const telMeta = (tel) => { const d = String(tel || '').replace(/\D/g, ''); return (d.length === 10 || d.length === 11) ? '55' + d : (d.length >= 12 && d.startsWith('55') ? d : ''); };
function csvNaoCompraram(lista){      // formato do Meta Ads: uma coluna "phone". Quem saiu da lista NUNCA entra.
  const tels = [...new Set(lista.filter(x=>!x.ja_comprou && !x.optout).map(x=>telMeta(x.telefone)).filter(Boolean))];
  return 'phone\n' + tels.join('\n') + (tels.length ? '\n' : '');
}
function csvCompleto(lista){
  const cab = ['nome','telefone','origem','motivo','primeiro_contato','ultimo_contato','ja_comprou','total_pedidos','saiu_da_lista'];
  const dia = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR', {timeZone:'America/Fortaleza'}) : '';
  const linhas = lista.map(x=>[x.nome || '', x.telefone, x.origem || '', x.motivo_inicial || '', dia(x.primeiro_contato_em), dia(x.ultimo_contato_em), x.ja_comprou ? 'sim' : 'nao', x.total_pedidos, x.optout ? 'sim' : 'nao'].map(csvCampo).join(','));
  return '\ufeff' + cab.join(',') + '\n' + linhas.join('\n') + (linhas.length ? '\n' : '');
}
function baixarCsv(nome, texto){
  const url = URL.createObjectURL(new Blob([texto], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function desenharContatos(c){
  const lista = botDados.contatos || [];
  c.appendChild(el('h2', '', 'Contatos que o robô guardou'));
  c.appendChild(el('p', 'dica', 'Todo mundo que chama no WhatsApp fica guardado, mesmo com a loja fechada e mesmo sem comprar. Quem pede para sair da lista (SAIR) fica de fora de qualquer anúncio.'));
  const compraram = lista.filter(x=>x.ja_comprou).length, saiu = lista.filter(x=>x.optout).length;
  const falta = lista.filter(x=>!x.ja_comprou && !x.optout).length;
  const sd = el('div', 'saldo');
  [[lista.length, 'contatos'], [falta, 'ainda não compraram'], [compraram, 'já compraram'], [saiu, 'saíram da lista']].forEach(([n, r])=>{ const d = el('div'); d.appendChild(document.createTextNode(String(n))); d.appendChild(el('small', '', r)); sd.appendChild(d); });
  c.appendChild(sd);
  const cont = {}; lista.forEach(x=>{ const k = x.origem_campanha || x.origem_fonte || 'sem origem'; cont[k] = (cont[k] || 0) + 1; });
  const top = Object.entries(cont).sort((a, b)=>b[1] - a[1]).slice(0, 6);
  if(top.length) c.appendChild(el('p', 'dica', 'De onde vêm: ' + top.map(([k, n])=>k + ' (' + n + ')').join(' · ')));
  const hoje = agoraLocal().data;
  const b1 = el('button', 'btn verde', 'Baixar: quem ainda não comprou (Meta Ads)'); b1.id = 'btnCsvNaoComprou';
  b1.onclick = ()=>{ if(!falta){ aviso('Ninguém para exportar ainda.', 'erro'); return; } baixarCsv('contatos-nao-compraram-' + hoje + '.csv', csvNaoCompraram(lista)); };
  const b2 = el('button', 'btn cinza', 'Baixar todos os contatos (planilha)'); b2.id = 'btnCsvTodos';
  b2.onclick = ()=>{ if(!lista.length){ aviso('Nenhum contato ainda.', 'erro'); return; } baixarCsv('contatos-whatsapp-' + hoje + '.csv', csvCompleto(lista)); };
  const lin = el('div', 'linha'); lin.appendChild(b1); lin.appendChild(b2); c.appendChild(lin);
  c.appendChild(el('p', 'dica', 'Para anunciar: no Meta Ads, vá em Públicos > Criar público > Lista de clientes e suba o primeiro arquivo. Dá para criar anúncios só para quem conversou e ainda não comprou.'));
}

async function telaRobo(c){
  c.appendChild(el('div', 'vazio', 'Carregando o robô...'));
  await carregarBot(); if(aba !== 'robo') return;
  c.innerHTML = '';
  if(!botDados.instalado){ c.appendChild(el('div', 'vazio', 'O robô ainda não foi instalado no banco de dados (falta rodar a Parte F no Supabase).')); return; }
  const cfg = botDados.cfg;
  if(!cfg){ c.appendChild(el('div', 'vazio', 'Configuração do robô não encontrada para esta loja.')); return; }

  const st = el('div', 'cartao'); const topo = el('div', 'topo');
  topo.appendChild(el('span', 'nome', 'Robô de WhatsApp')); topo.appendChild(el('span', 'chip ' + (cfg.ativo ? 'ok' : 'nao'), cfg.ativo ? 'Ligado' : 'Desligado'));
  st.appendChild(topo);
  st.appendChild(el('div', 'dica', cfg.ativo ? 'Respondendo clientes e avisando sobre os pedidos.' : 'Desligado: não responde ninguém e não envia avisos. Pode ligar quando a conexão com o WhatsApp estiver pronta.'));
  const ef = botDados.hoje, cont = (s)=>ef.filter(x=>x.status === s).length;
  st.appendChild(el('div', 'dica', 'Hoje: ' + botDados.entradas + ' mensagem(ns) de clientes · ' + cont('enviado') + ' aviso(s) enviado(s) · ' + cont('sem_janela') + ' sem janela de 24h · ' + cont('erro') + ' com erro.'));
  const bt = el('button', 'btn ' + (cfg.ativo ? 'cinza' : 'verde'), cfg.ativo ? 'Desligar robô' : 'Ligar robô'); bt.style.marginTop = '8px';
  bt.onclick = ()=>{
    if(!cfg.ativo && !confirm('Ligar o robô? Ele passa a responder os clientes e a mandar avisos dos pedidos pelo WhatsApp.')) return;
    tentar(async()=>{ await atualizar('bot_config', 'loja_id=eq.' + LOJA, {ativo:!cfg.ativo, atualizado_em:new Date().toISOString()}); desenhar(); }, cfg.ativo ? 'Robô desligado' : 'Robô ligado');
  };
  st.appendChild(bt); c.appendChild(st);

  const boxAtend = el('div'); boxAtend.id = 'boxAtend'; c.appendChild(boxAtend); desenharAtend(boxAtend);
  clearInterval(timerRobo);
  timerRobo = setInterval(async()=>{
    if(aba !== 'robo' || !sessao){ clearInterval(timerRobo); return; }
    const ativo = document.activeElement; if(ativo && ativo.tagName === 'TEXTAREA' && $('boxAtend') && $('boxAtend').contains(ativo)) return;   // está digitando: não mexe na tela
    try{ const fo = 'loja_id=eq.' + LOJA; botDados.conv = await api(`/rest/v1/bot_conversas?${fo}&precisa_humano=eq.true&order=ultima_entrada_em.desc`);
      botDados.msgs = botDados.conv.length ? await api(`/rest/v1/bot_mensagens?${fo}&telefone=in.(${botDados.conv.map(x=>x.telefone).join(',')})&order=criado_em.desc&limit=60`) : [];
      const b = $('boxAtend'); if(b) desenharAtend(b); }catch(e){}
  }, 15000);

  desenharContatos(c);

  c.appendChild(el('h2', '', 'Ajustes'));
  const aj = el('div', 'cartao'); const lk = el('input'); lk.value = cfg.link_site; lk.style.width = '100%';
  const hh = inputNum(cfg.humano_horas, '1');
  aj.appendChild(campo('Link do site (o que o robô manda)', lk));
  const l1 = el('div', 'linha'); l1.appendChild(campo('Horas que o robô fica quieto depois que pedem atendente', hh)); aj.appendChild(l1);
  const sv = el('button', 'btn verde', 'Salvar ajustes'); sv.style.marginTop = '8px';
  sv.onclick = ()=>tentar(async()=>{
    const link = lk.value.trim(); if(!/^https:\/\/[^\s]+$/.test(link)) throw new Error('O link precisa começar com https://');
    const h = num(hh.value); if(h === null || h < 1 || h > 72) throw new Error('Horas: informe de 1 a 72.');
    await atualizar('bot_config', 'loja_id=eq.' + LOJA, {link_site:link.replace(/\/+$/, ''), humano_horas:Math.round(h), atualizado_em:new Date().toISOString()});
  }, 'Ajustes salvos');
  aj.appendChild(sv); c.appendChild(aj);

  c.appendChild(el('h2', '', 'Mensagens do robô'));
  c.appendChild(el('p', 'dica', 'Você pode mudar o texto de cada resposta. Os trechos entre chaves são preenchidos sozinhos: {nome_virgula} (", Maria"), {link}, {numero} (do pedido), {previsao}, {abre}, {bairro}, {taxa} e {ganho}. Mantenha só os que já estão no texto.'));
  TEXTOS_ROBO.forEach(([chave, rotulo])=>{
    const t = botDados.textos.find(x=>x.chave === chave); if(!t) return;
    const d = el('details'); d.appendChild(el('summary', '', rotulo));
    const ta = el('textarea'); ta.value = t.texto; ta.style.minHeight = '110px'; ta.style.width = '100%'; ta.style.marginTop = '6px'; ta.style.padding = '9px'; ta.style.border = '1.5px solid var(--line)'; ta.style.borderRadius = '9px'; d.appendChild(ta);
    const b = el('button', 'btn verde peq', 'Salvar este texto'); b.style.marginTop = '6px';
    b.onclick = ()=>tentar(async()=>{
      const novo = ta.value.trim(); if(!novo) throw new Error('O texto não pode ficar vazio.');
      const antigos = (t.texto.match(/\{[a-z_]+\}/g) || []), novos = (novo.match(/\{[a-z_]+\}/g) || []);
      const estranho = novos.find(x=>antigos.indexOf(x) < 0); if(estranho) throw new Error('O trecho ' + estranho + ' não existe neste texto. Use só os que já estavam.');
      await atualizar('bot_textos', `loja_id=eq.${LOJA}&chave=eq.${chave}`, {texto:novo}); t.texto = novo;
    }, 'Texto salvo');
    d.appendChild(b); c.appendChild(d);
  });
}

/* ---------- inicio ---------- */
async function iniciar(){
  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  try{ PAPEL = (await rpc('gestao_meu_papel', {p_loja:LOJA})) === 'leitor' ? 'leitor' : 'dono'; }catch(e){ PAPEL = 'dono'; }   // sem a Parte AG instalada, segue como antes
  if(PAPEL === 'leitor'){ aba = 'relatorios'; await tentar(async()=>{ desenhar(); }); return; }   // leitor nao carrega cardapio, clientes etc.
  await tentar(async()=>{ await carregarTudo(); desenhar(); });
  atualizarAvisoNotas(); clearInterval(timerAvisoNotas); timerAvisoNotas = setInterval(atualizarAvisoNotas, 120000);   // confere as notas a cada 2 min
}
$('formLogin').addEventListener('submit', async (e)=>{
  e.preventDefault(); $('erroLogin').textContent = '';
  const ok = await entrar($('email').value.trim(), $('senha').value);
  if(ok) iniciar(); else $('erroLogin').textContent = 'E-mail ou senha incorretos.';
});
$('btnSair').onclick = sair;
(function(){
  try{ const s = JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null'); if(s && s.refresh_token){ sessao = s; iniciar(); renovar().then(ok=>{ if(ok === false) sair(); }); } }catch(e){}
})();
